<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jonbttt's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg:     #0d0a07;
    --purple: #731fa1;
    --white:  #ffffff;
    --font:   'Averia Serif Libre', Georgia, serif;
}

html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    color: var(--white);
    -webkit-user-select: none;
    user-select: none;
}

/* ── SCREEN 1: PACK ── */
#screen-pack {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    gap: 1.4rem;
    z-index: 1;
}

#pack-container {
    position: relative;
    width: clamp(150px, 16vw, 220px);
    border-radius: 8px;
    overflow: hidden;
}

#pack-img {
    position: relative;
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    pointer-events: none;
    -webkit-user-drag: none;
    z-index: 1;
}

#pack-foil-rainbow {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.15;
    background: linear-gradient(
        135deg,
        hsla(0,100%,70%,1) 0%,
        hsla(52,100%,70%,1) 14%,
        hsla(120,100%,70%,1) 28%,
        hsla(180,100%,70%,1) 43%,
        hsla(240,100%,70%,1) 57%,
        hsla(290,100%,70%,1) 71%,
        hsla(320,100%,70%,1) 85%,
        hsla(360,100%,70%,1) 100%
    );
    transition: transform 0.15s ease;
    -webkit-mask-image: url('img/pack.png');
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-image: url('img/pack.png');
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
}

#pack-foil-highlight {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 35%, transparent 65%);
    -webkit-mask-image: url('img/pack.png');
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-image: url('img/pack.png');
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
}

#pack-drag-zone {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 18%;
    z-index: 10;
    cursor: col-resize;
    border-radius: 8px 8px 0 0;
}

#pack-drag-zone::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: repeating-linear-gradient(90deg,
        rgba(255,255,255,0.18) 0px, rgba(255,255,255,0.18) 4px,
        transparent 4px, transparent 8px);
    pointer-events: none;
}

#pack-drag-zone::before {
    content: '';
    position: absolute;
    bottom: -3px; left: 6px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.30);
    pointer-events: none;
}

#pack-drag-glow {
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 2px;
    pointer-events: none;
    display: none;
    z-index: 11;
    background: linear-gradient(90deg, rgba(115,31,161,0.5) 0%, #9b4fd6 70%, #c090f0 100%);
    box-shadow: 0 0 8px 2px rgba(115,31,161,0.85), 0 0 2px 1px #c090f0;
    border-radius: 1px;
    transition: none;
}

#pack-drag-glow::after {
    content: '';
    position: absolute;
    right: -6px; top: 50%;
    transform: translateY(-50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #c090f0 35%, rgba(115,31,161,0.5) 65%, transparent 100%);
    filter: blur(1.5px);
}

#pack-hint {
    font-family: var(--font);
    font-size: 0.58rem;
    letter-spacing: 0.22em;
    color: var(--white);
    opacity: 0.28;
    pointer-events: none;
    margin-top: 0.2rem;
    font-variant: small-caps;
}

/* ── SCREEN 2: CAROUSEL ── */
#screen-carousel {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    overflow: hidden;
}

#screen-carousel.revealing {
    animation: overlayFadeIn 0.3s ease both;
}

#carousel-stage {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 900px;
    perspective-origin: 50% 50%;
    cursor: grab;
}

#carousel-stage.grabbing { cursor: grabbing; }

#carousel-track {
    position: relative;
    width: 0; height: 0;
    transform-style: preserve-3d;
    will-change: transform;
}

.c-card {
    position: absolute;
    width: clamp(150px, 16.875vw, 225px);
    aspect-ratio: 5 / 7;
    transform-style: preserve-3d;
    cursor: pointer;
}

.c-face {
    position: absolute;
    inset: 0;
    border-radius: 4.5%;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
}

.c-face img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
}

.c-face-back { transform: rotateY(180deg); }

#card-label {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.15s;
}

#card-label-typeline {
    font-family: var(--font);
    font-size: 0.58rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: var(--white);
    opacity: 0.4;
    margin-bottom: 0.35rem;
}

#card-label-name {
    font-family: var(--font);
    font-size: clamp(1.3rem, 2.4vw, 2.1rem);
    font-weight: 400;
    color: var(--white);
    letter-spacing: 0.03em;
    line-height: 1.1;
}

#contact-links {
    position: absolute;
    bottom: 26px;
    right: 32px;
    display: flex;
    gap: 1.6rem;
}

#contact-links a {
    font-family: var(--font);
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0.35;
    text-decoration: none;
    transition: opacity 0.2s;
}

#contact-links a:hover { opacity: 1; }

/* ── OVERLAY ── */
#overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: none;
}

#overlay.active { display: flex; }

#overlay-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(5,3,2,0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    cursor: pointer;
}

#overlay-inner {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100%;
    height: 100%;
    animation: overlayFadeIn 0.3s ease both;
}

@keyframes overlayFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}

#overlay-card-side {
    width: 45%;
    flex-shrink: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

#overlay-card-3d {
    position: relative;
    width: clamp(170px, 20vw, 280px);
    aspect-ratio: 5 / 7;
    perspective: 800px;
    z-index: 1;
}

#overlay-card-inner {
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    will-change: transform;
}

#overlay-card-inner.flipped { transform: rotateY(180deg); }

#overlay-card-front, #overlay-card-back-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 4.5%;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.85);
}

#overlay-card-front img,
#overlay-card-back-face img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
}

#overlay-card-back-face { transform: rotateY(180deg); }

#overlay-card-shine {
    position: absolute;
    inset: 0;
    border-radius: 4.5%;
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: screen;
}

#overlay-flip-hint {
    position: absolute;
    bottom: 1.6rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font);
    font-size: 0.56rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
    animation: pulse 2.8s ease-in-out infinite;
    pointer-events: none;
}

@keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.65} }

#overlay-info-side {
    flex: 1;
    background: var(--white);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 3.5rem 3.2rem 3rem;
    -webkit-user-select: text;
    user-select: text;
    cursor: default;
}

#overlay-info-side::-webkit-scrollbar { width: 3px; }
#overlay-info-side::-webkit-scrollbar-thumb { background: rgba(115,31,161,0.25); border-radius: 2px; }

#overlay-card-name {
    font-family: var(--font);
    font-size: clamp(1.7rem, 2.8vw, 2.6rem);
    font-weight: 700;
    color: #0d0a07;
    line-height: 1.05;
    margin-bottom: 0.45rem;
}

#overlay-type-line {
    font-family: var(--font);
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: #0d0a07;
    opacity: 0.3;
    margin-bottom: 2.2rem;
}

.overlay-section-text a { color: #731fa1; text-decoration: none; font-weight: bold; }
.overlay-section-text a:hover { color: #731fa1; }

.overlay-section-text {
    font-family: var(--font);
    font-size: 0.87rem;
    line-height: 1.85;
    color: #1e1a17;
    white-space: pre-wrap;
    margin: 0;
}

.overlay-divider {
    height: 1px;
    background: var(--purple);
    opacity: 0.2;
    margin: 1.8rem 0;
    flex-shrink: 0;
}

.overlay-section-why {
    font-family: var(--font);
    font-size: 0.85rem;
    line-height: 1.9;
    color: #2e2a27;
    white-space: pre-wrap;
    font-style: italic;
    border-left: 2px solid var(--purple);
    padding-left: 1.1rem;
    margin: 0;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(115,31,161,0.3); border-radius: 2px; }

#overlay-info-side *::selection     { background: #731fa1; color: #ffffff; }
#overlay-info-side *::-moz-selection { background: #731fa1; color: #ffffff; }

#overlay-back {
    position: absolute;
    top: 1.4rem;
    left: 1.6rem;
    z-index: 2;
    background: none;
    border: none;
    color: var(--white);
    font-family: var(--font);
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.38;
    cursor: pointer;
    padding: 0.4rem 0;
    transition: opacity 0.18s;
}
#overlay-back:hover { opacity: 1; }

@media (max-width: 680px) {
    #overlay-inner { flex-direction: column; overflow-y: auto; }
    #overlay-card-side {
        width: 100%;
        flex-shrink: 0;
        height: 52vw;
        min-height: 220px;
        max-height: 320px;
    }
    #overlay-card-3d { width: clamp(120px, 36vw, 180px); }
    #overlay-info-side { flex: 1; padding: 2rem 1.6rem 2.4rem; overflow-y: visible; }
    #overlay-card-name { font-size: clamp(1.3rem, 6vw, 2rem); }
    #overlay-back { top: 0.8rem; left: 1rem; }
}
    </style>
</head>
<body>

<script>
'use strict';

// ── CARD DATA ──
const CARDS = [
    {
        img: 'img/card-1.png',
        name: 'About Me',
        typeLine: 'Goblin Engineer',
        about: 'Hey, I\'m Jonathan! I\'m currently a final-year CS student at UNSW specialising in Security Engineering, graduating September 2026. Previously Software Engineer at The Golfer Network and AI Engineer at PT Wide Technologies Indonesia. Now, I\'m looking for grad roles in cybersecurity and software development. Nice to meet ya!',
        why: 'I chose Goblin Engineer as my face card because its flavor truly fits me. He\'s a tinkerer. The art shows someone surrounded by their work, actively in the middle of it. In terms of function, the Goblin Engineer puts an artifact into the graveyard and recurs a different one from it; build something, break it, pull out something more useful. This is my process within security engineering, and something I genuinely love doing.'
    },
    {
        img: 'img/card-2.png',
        name: 'Projects',
        typeLine: 'Mizzix of the Izmagnus',
        about: 'Sentinel Honeypot - <a href="./blog/sentinel-honeypot.html">Writeup</a>\nWard-XDP (in progress) - An inline eBPF/XDP intrusion prevention system that drops flood traffic at the network driver before the kernel ever sees it. SYN flood detection is complete and benchmarked at ~51ns per packet. Written in C with a Go control plane. <a href="https://github.com/jonbttt/Ward-XDP" target="_blank" rel="noopener">GitHub</a>\nrk-veil - A Linux kernel module rootkit built from scratch. Syscall hooking, process hiding, and privilege escalation on kernel 6.x, with every technique mapped to MITRE ATT&CK and its detection surface documented. Presented at SCONES 2026. <a href="https://github.com/jonbttt/rk-veil" target="_blank" rel="noopener">GitHub</a>\nHome Lab SIEM - A detection engineering pipeline at home. ELK with OTX AlienVault threat intelligence feeds and Jira ticketing on a Kali Linux VM.\nStegSweeper - My first security project. Hides an AES-128 encrypted message inside a playable Minesweeper board, where the mine layout is the ciphertext. <a href="https://github.com/jonbttt/stegsweeper" target="_blank" rel="noopener">GitHub</a>',
        why: 'Mizzix\'s ability lets you get an experience counter every time you cast an instant or sorcery with a mana cost greater than the number of counters you have, and those counters reduce the cost of future spells. The more I\'ve done, the easier the next thing becomes.'
    },
    {
        img: 'img/card-3.png',
        name: 'Experience',
        typeLine: 'Snapcaster Mage',
        about: 'UNSW - Scrum Master for a team of developers building a mixed reality application for a UNSW professor. Led sprint planning, managed delivery, and contributed to the Unity codebase directly.\nThe Golfer Network - Software Engineer building full-stack products. Worked across the entire delivery pipeline and meaningfully reduced backend turnaround time in production.\nWide Technologies Indonesia - AI Engineer working with and learning LLMs, computer vision, and machine learning pipelines.',
        why: 'I chose Snapcaster Mage mainly because of the mechanic, flashback. Flashback allows me to cast that instant or sorcery from my graveyard and exiles it, allowing me to reuse something I previously casted. My experiences act in the same way that I\'m able to reuse them for whatever comes next.'
    },
    {
        img: 'img/card-4.png',
        name: 'Lifting',
        typeLine: 'Zilortha, Strength Incarnate',
        about: 'After a busy day, I always love training. I\'m an amateur powerlifter in the 72kg weight class with around 2.5 yrs of training. I plan on competing soon this year in powerlifting and joining an amateur bodybuilding comp sometime next year.',
        why: 'Zilortha makes your creatures deal damage based on power rather than toughness, raw strength over endurance. That\'s what powerlifting is to me. Also, I\'m a Godzilla fan.'
    },
    {
        img: 'img/card-5.png',
        name: 'Hobbies',
        typeLine: 'Mox Amber',
        about: 'I\'m an Avid MTG player, mainly Commander with friends and Arena on downtime. You can view my Commander decks on my Moxfield: moxfield.com/users/jonbttt (It\'s also linked below in the previous section). I\'m also a big video game nerd with my top 5 being Factorio, Stellaris, Cruelty Squad, Risk of Rain 2, and Deadlock. Other than that, I enjoy fishing, thrifting, and cafe-hopping with friends.',
        why: 'A Mox is a 0-cost artifact that generates value as soon as it comes down. I specifically chose the Mox Amber as it has an added prerequisite that felt right. Hobbies only show up fully when everything else (the work, the training, the ambition) is already there.'
    },
    {
        img: 'img/card-6.png',
        name: 'Travelling',
        typeLine: 'Explore',
        about: 'Originally from Jakarta, now based in Sydney. I\'ve travelled across Asia and parts of Europe. In the coming months, I really hope I\'ll be able to see more of Australia (I\'d love to go hiking around Kosciuszko National Park and visit Uluru one day).',
        why: 'This card speaks for itself, both in terms of the card\'s function and flavor.'
    }
];

// Preload images so they're cached before the carousel builds
(function preloadImages() {
    CARDS.forEach(card => { const i = new Image(); i.src = card.img; });
    const b = new Image(); b.src = 'img/cardback.png';
}());

const N          = CARDS.length;
const CARD_ANGLE = 360 / N;
const TILT_X     = -5;
const RADIUS     = 380;
const DRAG_DEG   = 0.36;

// ── PACK OPENING ──
const packContainer = document.getElementById('pack-container');
const packImg       = document.getElementById('pack-img');
const packFoilR     = document.getElementById('pack-foil-rainbow');
const packFoilH     = document.getElementById('pack-foil-highlight');
const packDragZone  = document.getElementById('pack-drag-zone');
const packDragGlow  = document.getElementById('pack-drag-glow');

let packOpened   = false;
let packDragging = false;
const PACK_THRESHOLD = 0.98;

// Cut-spark canvas state
let cutCanvas   = null, cutCtx = null;
let cutParts    = [];
let cutRAF      = null;
let cutCursorX  = 0, cutCursorY = 0;
let cutLineLeft = 0;
let cutMoved    = false;

function startCutCanvas() {
    cutCanvas = document.createElement('canvas');
    cutCanvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:9;pointer-events:none;';
    cutCanvas.width  = window.innerWidth;
    cutCanvas.height = window.innerHeight;
    document.body.appendChild(cutCanvas);
    cutCtx   = cutCanvas.getContext('2d');
    cutParts = [];
    cutMoved = false;
    tickCutCanvas();
}

function stopCutCanvas() {
    cancelAnimationFrame(cutRAF);
    if (cutCanvas) { cutCanvas.remove(); cutCanvas = null; cutCtx = null; }
    cutParts = [];
    cutMoved = false;
}

function spawnCutSparks() {
    const openedW = cutCursorX - cutLineLeft;
    if (openedW < 2) return;
    const sx    = cutLineLeft + Math.random() * openedW;
    const sy    = cutCursorY;
    const up    = Math.random() > 0.5;
    const vx    = (Math.random() - 0.5) * 0.5;
    const vy    = (up ? -1 : 1) * (0.25 + Math.random() * 0.9);
    const white = Math.random() > 0.45;
    cutParts.push({
        x: sx, y: sy, vx, vy,
        life  : 1,
        decay : 0.016 + Math.random() * 0.014,
        len   : 5 + Math.random() * 12,
        col   : white ? [255,255,255] : (Math.random() > 0.5 ? [192,144,240] : [220,160,255]),
    });
}

function tickCutCanvas() {
    cutRAF = requestAnimationFrame(tickCutCanvas);
    if (!cutCtx) return;

    if (packDragging && cutMoved) {
        spawnCutSparks();
        cutMoved = false;
    }

    cutCtx.clearRect(0, 0, cutCanvas.width, cutCanvas.height);
    cutCtx.globalCompositeOperation = 'lighter';

    const openedW = cutCursorX - cutLineLeft;
    if (packDragging && openedW > 1) {
        const lineGrd = cutCtx.createLinearGradient(cutLineLeft, 0, cutCursorX, 0);
        lineGrd.addColorStop(0,   'rgba(115,31,161,0)');
        lineGrd.addColorStop(0.3, 'rgba(155,79,214,0.35)');
        lineGrd.addColorStop(1,   'rgba(220,160,255,0.7)');
        cutCtx.beginPath();
        cutCtx.moveTo(cutLineLeft, cutCursorY);
        cutCtx.lineTo(cutCursorX,  cutCursorY);
        cutCtx.strokeStyle = lineGrd;
        cutCtx.lineWidth   = 4;
        cutCtx.stroke();
        cutCtx.beginPath();
        cutCtx.moveTo(cutLineLeft, cutCursorY);
        cutCtx.lineTo(cutCursorX,  cutCursorY);
        cutCtx.strokeStyle = 'rgba(255,255,255,0.55)';
        cutCtx.lineWidth   = 1;
        cutCtx.stroke();
    }

    const alive = [];
    for (const p of cutParts) {
        p.vx *= 0.93; p.vy *= 0.93;
        p.x  += p.vx; p.y  += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) continue;
        alive.push(p);

        const a  = p.life;
        const sp = Math.hypot(p.vx, p.vy) || 0.001;
        const nx = p.vx / sp, ny = p.vy / sp;
        const grd = cutCtx.createLinearGradient(p.x - nx * p.len, p.y - ny * p.len, p.x, p.y);
        const [r, g, b] = p.col;
        grd.addColorStop(0, `rgba(${r},${g},${b},0)`);
        grd.addColorStop(1, `rgba(${r},${g},${b},${a * 0.85})`);
        cutCtx.beginPath();
        cutCtx.moveTo(p.x - nx * p.len, p.y - ny * p.len);
        cutCtx.lineTo(p.x, p.y);
        cutCtx.strokeStyle = grd;
        cutCtx.lineWidth   = 1.1;
        cutCtx.stroke();
        cutCtx.beginPath();
        cutCtx.arc(p.x, p.y, 1.0, 0, Math.PI * 2);
        cutCtx.fillStyle = `rgba(255,255,255,${a * 0.8})`;
        cutCtx.fill();
    }
    cutCtx.globalCompositeOperation = 'source-over';
    cutParts = alive;
}

// Foil shimmer
let idleT = 0, idleRAF = null, isIdle = true, idleTimer = null;

function updatePackFoil(mx, my) {
    const angle = 130 + (mx - 50) * 0.22;
    const hue   = (mx / 100 * 160 + my / 100 * 80) % 360;
    packFoilR.style.background =
        `linear-gradient(${angle}deg,` +
        `hsla(${hue},100%,68%,1) 0%,` +
        `hsla(${(hue + 52) % 360},100%,70%,1) 14%,` +
        `hsla(${(hue + 120) % 360},100%,70%,1) 28%,` +
        `hsla(${(hue + 180) % 360},100%,70%,1) 43%,` +
        `hsla(${(hue + 240) % 360},100%,70%,1) 57%,` +
        `hsla(${(hue + 295) % 360},100%,70%,1) 71%,` +
        `hsla(${(hue + 330) % 360},100%,70%,1) 85%,` +
        `hsla(${hue},100%,68%,1) 100%)`;
    packFoilR.style.transform = '';
    packFoilH.style.background =
        `radial-gradient(circle at ${mx}% ${my}%,` +
        `rgba(255,255,255,0.22) 0%,` +
        `hsla(${hue},100%,75%,0.10) 20%,` +
        `hsla(${(hue + 80) % 360},100%,70%,0.05) 40%,` +
        `transparent 60%)`;
}

function idleTick() {
    if (!isIdle || packOpened) return;
    idleT += 0.007;
    const mx = 50 + 36 * Math.sin(idleT * 1.15);
    const my = 50 + 28 * Math.sin(idleT * 0.73 + 0.6);
    updatePackFoil(mx, my);
    idleRAF = requestAnimationFrame(idleTick);
}
function goIdle()   { isIdle = true;  cancelAnimationFrame(idleRAF); idleRAF = requestAnimationFrame(idleTick); }
function stopIdle() { isIdle = false; cancelAnimationFrame(idleRAF); }

goIdle();

function resetPackTilt() {
    packContainer.style.transition = 'transform 0.5s ease';
    packContainer.style.transform  = '';
}

document.addEventListener('mousemove', (e) => {
    if (packOpened) return;
    const rect  = packContainer.getBoundingClientRect();
    const cx    = rect.left + rect.width  / 2;
    const cy    = rect.top  + rect.height / 2;
    const dx    = (e.clientX - cx) / (rect.width  / 2);
    const dy    = (e.clientY - cy) / (rect.height / 2);
    const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

    if (!packDragging) {
        packContainer.style.transition = 'transform 0.08s ease-out';
        packContainer.style.transform  =
            `perspective(1200px) rotateY(${clamp(dx * 8, -8, 8)}deg)` +
            ` rotateX(${clamp(-dy * 8, -8, 8)}deg)`;
    }

    const mx = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    const my = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    stopIdle();
    updatePackFoil(mx, my);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(goIdle, 1600);
});

document.addEventListener('mouseleave', () => {
    if (!packOpened) { resetPackTilt(); goIdle(); }
});

function packDragStart(x) {
    if (packOpened) return;
    const rect  = packContainer.getBoundingClientRect();
    cutLineLeft = rect.left;
    cutCursorX  = rect.left;
    cutCursorY  = rect.top + rect.height * 0.18;
    packDragging = true;
    packDragGlow.style.display = 'block';
    packDragGlow.style.width   = '0px';
    startCutCanvas();
    stopIdle();
}

function packDragMove(x) {
    if (!packDragging || packOpened) return;
    const rect = packContainer.getBoundingClientRect();
    const relX = x - rect.left;
    const prog = Math.max(0, Math.min(1, relX / rect.width));
    packDragGlow.style.width = Math.max(0, relX) + 'px';
    const newX = Math.max(cutLineLeft, Math.min(x, rect.right));
    if (newX !== cutCursorX) {
        cutCursorX = newX;
        cutCursorY = rect.top + rect.height * 0.18;
        cutMoved   = true;
    }
    if (prog >= PACK_THRESHOLD) completePack();
}

function packDragCancel() {
    if (!packDragging) return;
    packDragging = false;
    packDragGlow.style.display = 'none';
    packDragGlow.style.width   = '0px';
    stopCutCanvas();
    resetPackTilt();
    goIdle();
}

function completePack() {
    if (packOpened) return;
    packOpened   = true;
    packDragging = false;
    packDragGlow.style.display = 'none';
    stopCutCanvas();
    resetPackTilt();
    cutToCarousel();
}

function cutToCarousel() {
    const packScreen = document.getElementById('screen-pack');
    const carScreen  = document.getElementById('screen-carousel');

    carRotation  = 0;
    carTargetRot = 0;
    buildCarousel();
    applyTrackTransform();
    updateLabel();

    packScreen.style.transition = 'opacity 0.28s ease';
    packScreen.style.opacity    = '0';

    setTimeout(() => {
        packScreen.style.display    = 'none';
        packScreen.style.opacity    = '';
        packScreen.style.transition = '';

        carScreen.style.opacity    = '0';
        carScreen.style.display    = 'block';
        void carScreen.offsetWidth;
        carScreen.style.transition = 'opacity 0.32s ease';
        carScreen.style.opacity    = '1';
        setTimeout(() => { carScreen.style.transition = ''; }, 360);
    }, 290);
}

packDragZone.addEventListener('mousedown',  (e) => { e.preventDefault(); packDragStart(e.clientX); });
document.addEventListener('mousemove',      (e) => { if (packDragging) packDragMove(e.clientX); });
document.addEventListener('mouseup',        ()  => { if (packDragging) packDragCancel(); });
packDragZone.addEventListener('touchstart', (e) => { e.preventDefault(); packDragStart(e.touches[0].clientX); }, { passive: false });
document.addEventListener('touchmove',      (e) => { if (packDragging) { e.preventDefault(); packDragMove(e.touches[0].clientX); } }, { passive: false });
document.addEventListener('touchend',       ()  => { if (packDragging) packDragCancel(); });

// ── CAROUSEL ──
const carouselStage = document.getElementById('carousel-stage');
const carouselTrack = document.getElementById('carousel-track');
const cardLabel     = document.getElementById('card-label');
const labelTypeline = document.getElementById('card-label-typeline');
const labelName     = document.getElementById('card-label-name');

let carRotation  = 0;
let carTargetRot = 0;
let carDragging  = false;
let carDragX0    = 0;
let carDragY0    = 0;
let carDragRot0  = 0;

function buildCarousel() {
    carouselTrack.innerHTML = '';
    const cardW = Math.max(150, Math.min(window.innerWidth * 0.16875, 225));
    const cardH = cardW * (7 / 5);

    CARDS.forEach((data, i) => {
        const slot = document.createElement('div');
        slot.className     = 'c-card';
        slot.dataset.index = i;
        slot.style.marginLeft = `${-cardW / 2}px`;
        slot.style.marginTop  = `${-cardH / 2}px`;
        slot.style.transform  = `rotateY(${i * CARD_ANGLE}deg) translateZ(${RADIUS}px)`;

        const front = document.createElement('div');
        front.className = 'c-face c-face-front';
        const fImg = document.createElement('img');
        fImg.src = data.img; fImg.alt = data.name;
        front.appendChild(fImg);

        const back = document.createElement('div');
        back.className = 'c-face c-face-back';
        const bImg = document.createElement('img');
        bImg.src = 'img/cardback.png'; bImg.alt = 'Card Back';
        back.appendChild(bImg);

        slot.appendChild(front);
        slot.appendChild(back);
        carouselTrack.appendChild(slot);
    });
}

function applyTrackTransform() {
    carouselTrack.style.transform = `rotateX(${TILT_X}deg) rotateY(${carRotation}deg)`;
}

function getActiveIndex() {
    const steps = Math.round(-carRotation / CARD_ANGLE);
    return ((steps % N) + N) % N;
}

function updateLabel() {
    const steps       = -carRotation / CARD_ANGLE;
    const nearestStep = Math.round(steps);
    const activeIdx   = ((nearestStep % N) + N) % N;
    const drift       = Math.abs(steps - nearestStep);

    labelTypeline.textContent = CARDS[activeIdx].typeLine;
    labelName.textContent     = CARDS[activeIdx].name;
    cardLabel.style.opacity   = Math.max(0, 1 - drift * 3.5);

    carouselTrack.querySelectorAll('.c-card').forEach((el, i) => {
        const raw      = ((i * CARD_ANGLE + carRotation) % 360 + 360) % 360;
        const fromFront = raw > 180 ? 360 - raw : raw;
        el.style.pointerEvents = fromFront < 95 ? 'auto' : 'none';
    });
}

const SNAP_EASE = 'transform 0.38s cubic-bezier(0.22, 1, 0.36, 1)';
let snapTimer = null;

function snapWithTransition() {
    carouselTrack.style.transition = SNAP_EASE;
    carRotation = carTargetRot;
    applyTrackTransform();
    updateLabel();
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { carouselTrack.style.transition = ''; }, 420);
}

function snapToNearest() {
    carTargetRot = Math.round(carRotation / CARD_ANGLE) * CARD_ANGLE;
    snapWithTransition();
}

function snapToCard(idx) {
    const activeIdx  = getActiveIndex();
    const delta_raw  = (activeIdx - idx + N) % N;
    const delta      = delta_raw > N / 2 ? delta_raw - N : delta_raw;
    carTargetRot     = (Math.round(carRotation / CARD_ANGLE) + delta) * CARD_ANGLE;
    snapWithTransition();
}

function onCarDragStart(x, y) {
    clearTimeout(snapTimer);
    carouselTrack.style.transition = '';
    carDragging = true;
    carDragX0   = x;
    carDragY0   = y;
    carDragRot0 = carRotation;
    carouselStage.classList.add('grabbing');
}

function onCarDragMove(x) {
    if (!carDragging) return;
    carRotation = carDragRot0 + (x - carDragX0) * DRAG_DEG;
    applyTrackTransform();
    updateLabel();
}

function onCarDragEnd(x, y, target) {
    if (!carDragging) return;
    carDragging = false;
    carouselStage.classList.remove('grabbing');

    const dx = Math.abs(x - carDragX0);
    const dy = Math.abs(y - carDragY0);

    if (dx < 8 && dy < 8) {
        const slot = target?.closest?.('.c-card');
        if (slot) {
            const clickedIdx = parseInt(slot.dataset.index);
            const activeIdx  = getActiveIndex();
            if (clickedIdx === activeIdx) { snapToNearest(); openOverlay(activeIdx); return; }
            snapToCard(clickedIdx);
            return;
        }
    }
    snapToNearest();
}

carouselStage.addEventListener('mousedown', (e) => { e.preventDefault(); onCarDragStart(e.clientX, e.clientY); });
document.addEventListener('mousemove',  (e) => { if (carDragging) onCarDragMove(e.clientX); });
document.addEventListener('mouseup',    (e) => { if (carDragging) onCarDragEnd(e.clientX, e.clientY, e.target); });

carouselStage.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    onCarDragStart(t.clientX, t.clientY);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
    if (carDragging) onCarDragMove(e.touches[0].clientX);
}, { passive: true });
document.addEventListener('touchend', (e) => {
    if (!carDragging) return;
    const t = e.changedTouches[0];
    onCarDragEnd(t.clientX, t.clientY, document.elementFromPoint(t.clientX, t.clientY));
});

// ── OVERLAY ──
const overlay         = document.getElementById('overlay');
const overlayBackdrop = document.getElementById('overlay-backdrop');
const overlayCName    = document.getElementById('overlay-card-name');
const overlayTLine    = document.getElementById('overlay-type-line');
const overlayS1       = document.getElementById('overlay-section1');
const overlayS2       = document.getElementById('overlay-section2');
const overlayFrontImg = document.getElementById('overlay-front-img');
const overlayCardInn  = document.getElementById('overlay-card-inner');
const overlayCardSide = document.getElementById('overlay-card-side');
const overlayShine    = document.getElementById('overlay-card-shine');
const flipHint        = document.getElementById('overlay-flip-hint');

let isFlipped = false;

function openOverlay(idx) {
    const d = CARDS[idx];
    isFlipped = false;
    overlayCardInn.classList.remove('flipped');
    overlayCardInn.style.transform  = '';
    overlayCardInn.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
    overlayFrontImg.src      = d.img;
    overlayCName.textContent = d.name;
    overlayTLine.textContent = d.typeLine;
    overlayS1.innerHTML      = d.about.replace(/\n{2,}/g, '\n');
    overlayS2.innerHTML      = d.why.replace(/\n{2,}/g, '\n');
    flipHint.textContent     = 'click to flip';
    overlay.classList.add('active');
    overlay.style.display    = 'flex';
}

function closeOverlay() {
    overlay.classList.remove('active');
    overlay.style.display   = 'none';
    isFlipped               = false;
    overlayCardInn.classList.remove('flipped');
    overlayCardInn.style.transform = '';
    overlayShine.style.background  = '';

    const screenCar = document.getElementById('screen-carousel');
    screenCar.classList.remove('revealing');
    screenCar.offsetHeight;
    screenCar.classList.add('revealing');
    setTimeout(() => screenCar.classList.remove('revealing'), 300);
}

overlayBackdrop.addEventListener('click', closeOverlay);
document.getElementById('overlay-back').addEventListener('click', closeOverlay);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay(); });

overlayCardSide.addEventListener('click', (e) => {
    e.stopPropagation();
    isFlipped = !isFlipped;
    overlayCardInn.classList.toggle('flipped', isFlipped);
    overlayCardInn.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
    overlayCardInn.style.transform  = isFlipped ? 'rotateY(180deg)' : '';
});

overlayCardSide.addEventListener('mousemove', (e) => {
    const rect  = overlayCardSide.getBoundingClientRect();
    const dx    = (e.clientX - rect.left - rect.width  / 2) / (rect.width  / 2);
    const dy    = (e.clientY - rect.top  - rect.height / 2) / (rect.height / 2);
    const clamp = (v,a,b) => Math.min(Math.max(v,a),b);
    const rx    = clamp(-dy * 12, -12, 12);
    const ry    = clamp( dx * 12, -12, 12);
    overlayCardInn.style.transition = 'transform 0.08s ease-out';
    overlayCardInn.style.transform  = isFlipped
        ? `rotateY(${180 + ry}deg) rotateX(${rx}deg)`
        : `rotateY(${ry}deg) rotateX(${rx}deg)`;
    const mx  = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    const my  = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    const hue = (parseFloat(mx) / 100 * 300 + parseFloat(my) / 100 * 150) % 360;
    overlayShine.style.background =
        `radial-gradient(circle at ${mx}% ${my}%,` +
        `rgba(255,255,255,0.24) 0%,` +
        `hsla(${hue},100%,72%,0.14) 22%,` +
        `hsla(${(hue+70)%360},100%,68%,0.08) 44%,` +
        `transparent 66%)`;
});

overlayCardSide.addEventListener('mouseleave', () => {
    overlayCardInn.style.transition = 'transform 0.5s ease';
    overlayCardInn.style.transform  = isFlipped ? 'rotateY(180deg)' : '';
    overlayShine.style.background   = '';
});

document.getElementById('overlay-info-side').addEventListener('click', (e) => e.stopPropagation());
</script>
