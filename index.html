<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jonbttt's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg:     #0d0a07;
    --purple: #731fa1;
    --white:  #ffffff;
    --font:   'Averia Serif Libre', Georgia, serif;
}

html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    color: var(--white);
    -webkit-user-select: none;
    user-select: none;
}

/* ── SCREEN 1: PACK ── */
/* The 3D pack is drawn by js/pack.js on a transparent canvas. The stage behind
   it is plain CSS so it can dim while you cut, as it does in TCG Pocket. */
#screen-pack {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
}
#screen-pack.is-grabbing { cursor: grabbing; }
#screen-pack.is-open { cursor: default; }

#pack-env {
    position: absolute;
    inset: 0;
    background: var(--bg);
}

#pack-dim {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    transition: opacity 0.5s ease;
}

#pack-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

/* shown only when WebGL is unavailable */
#pack-fallback {
    position: absolute;
    left: 0; right: 0;
    top: 56%;
    margin-inline: auto;
    height: min(46vh, 520px);
    translate: 0 -50%;
    border-radius: 6px;
}
#pack-fallback[hidden] { display: none; }

/* Identity block — a visitor must know whose site this is before
   they work out that the pack opens. */
#pack-intro {
    position: absolute;
    top: clamp(2.5rem, 8vh, 5rem);
    left: 0; right: 0;
    margin-inline: auto;
    width: min(44rem, 100%);
    padding: 0 1.5rem;
    text-align: center;
    pointer-events: none;
    animation: riseIn 0.7s cubic-bezier(0.23, 1, 0.32, 1) 0.1s backwards;
    transition: opacity 0.3s ease;
}

#pack-name {
    font-family: var(--font);
    font-size: clamp(2.6rem, 6.4vw, 4.5rem);
    font-weight: 400;
    line-height: 1.02;
    letter-spacing: -0.015em;
    color: var(--white);
}

#pack-role {
    font-family: var(--font);
    font-size: clamp(1rem, 1.6vw, 1.2rem);
    line-height: 1.6;
    color: rgba(255,255,255,0.68);
    margin-top: 0.85rem;
    max-width: 27rem;
    text-wrap: balance;
    margin-left: auto;
    margin-right: auto;
}

#pack-open-btn {
    position: absolute;
    left: 0; right: 0;
    bottom: clamp(1.5rem, 5vh, 3rem);
    margin-inline: auto;
    width: max-content;
    font-family: var(--font);
    font-size: 1rem;
    letter-spacing: 0.01em;
    color: var(--white);
    background: var(--purple);
    border: 0;
    border-radius: 999px;
    padding: 0.85rem 1.75rem;
    cursor: pointer;
    animation: riseIn 0.7s cubic-bezier(0.23, 1, 0.32, 1) 0.45s backwards;
    transition: background-color 0.18s ease, scale 0.16s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
}
#pack-open-btn:hover { background: #8a2bbf; }
#pack-open-btn:active { scale: 0.97; }
#pack-open-btn:focus-visible { outline: 2px solid #c090f0; outline-offset: 3px; }
/* On the close-up the pack itself is the control; the button stays in the tab
   order so keyboards can still open it, and reappears when focused. */
#pack-open-btn.is-sr:not(:focus-visible) {
    opacity: 0;
    pointer-events: none;
}

#pack-trace {
    position: absolute;
    left: 0; right: 0;
    top: 30%;
    text-align: center;
    font-family: var(--font);
    font-size: 1rem;
    color: rgba(255, 255, 255, 0.72);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
}
#pack-trace.is-on { opacity: 1; }
#pack-trace:not(.is-on) { transition-duration: 0.06s; }   /* gone the instant you touch */

@keyframes riseIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
    #pack-intro, #pack-open-btn { animation: none; }
}

/* ── SCREEN 2: CAROUSEL ── */
#screen-carousel {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    overflow: hidden;
}

#screen-carousel.revealing {
    animation: overlayFadeIn 0.3s ease both;
}

#carousel-stage {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 900px;
    perspective-origin: 50% 50%;
    cursor: grab;
}

#carousel-stage.grabbing { cursor: grabbing; }

#carousel-track {
    position: relative;
    width: 0; height: 0;
    transform-style: preserve-3d;
    will-change: transform;
}

/* The ring sits back by its radius, so the front card is drawn at its own
   size. Pushed forward through the perspective instead, it was a smaller
   raster magnified ~1.7x, and looked soft. */
.c-card {
    position: absolute;
    width: clamp(260px, 29.2vw, 390px);
    aspect-ratio: 5 / 7;
    transform-style: preserve-3d;
    cursor: pointer;
}

.c-face {
    position: absolute;
    inset: 0;
    border-radius: 4.5%;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
}

.c-face img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
}

.c-face-back { transform: rotateY(180deg); }

#card-label {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.15s;
}

#card-label-typeline {
    font-family: var(--font);
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: var(--white);
    opacity: 0.4;
    margin-bottom: 0.35rem;
}

#card-label-name {
    font-family: var(--font);
    font-size: clamp(1.3rem, 2.4vw, 2.1rem);
    font-weight: 400;
    color: var(--white);
    letter-spacing: 0.03em;
    line-height: 1.1;
}

#contact-links {
    position: absolute;
    bottom: 26px;
    right: 32px;
    display: flex;
    gap: 1.6rem;
}

#contact-links a {
    font-family: var(--font);
    font-size: 0.9rem;
    letter-spacing: 0.01em;
    color: var(--white);
    opacity: 0.55;
    text-decoration: none;
    transition: opacity 0.2s;
}

#contact-links a:hover { opacity: 1; }

/* ── OVERLAY ── */
#overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: none;
}

#overlay.active { display: flex; }

#overlay-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(5,3,2,0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    cursor: pointer;
}

#overlay-inner {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100%;
    height: 100%;
    animation: overlayFadeIn 0.3s ease both;
}

@keyframes overlayFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}

#overlay-card-side {
    width: 45%;
    flex-shrink: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

#overlay-card-3d {
    position: relative;
    width: clamp(170px, 20vw, 280px);
    aspect-ratio: 5 / 7;
    perspective: 800px;
    z-index: 1;
}

#overlay-card-inner {
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    will-change: transform;
}

#overlay-card-inner.flipped { transform: rotateY(180deg); }

#overlay-card-front, #overlay-card-back-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 4.5%;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.85);
}

#overlay-card-front img,
#overlay-card-back-face img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
}

#overlay-card-back-face { transform: rotateY(180deg); }

#overlay-card-shine {
    position: absolute;
    inset: 0;
    border-radius: 4.5%;
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: screen;
}

#overlay-flip-hint {
    position: absolute;
    bottom: 1.6rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font);
    font-size: 0.56rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
    animation: pulse 2.8s ease-in-out infinite;
    pointer-events: none;
}

@keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.65} }

#overlay-info-side {
    flex: 1;
    background: var(--white);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 3.5rem 3.2rem 3rem;
    -webkit-user-select: text;
    user-select: text;
    cursor: default;
}

#overlay-info-side::-webkit-scrollbar { width: 3px; }
#overlay-info-side::-webkit-scrollbar-thumb { background: rgba(115,31,161,0.25); border-radius: 2px; }

#overlay-card-name {
    font-family: var(--font);
    font-size: clamp(1.7rem, 2.8vw, 2.6rem);
    font-weight: 400;
    color: #0d0a07;
    line-height: 1.05;
    margin-bottom: 0.45rem;
}

#overlay-type-line {
    font-family: var(--font);
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: #0d0a07;
    opacity: 0.3;
    margin-bottom: 2.2rem;
}

.overlay-section-text a { color: #731fa1; text-decoration: none; font-weight: bold; }
.overlay-section-text a:hover { color: #731fa1; }

.overlay-section-text {
    font-family: var(--font);
    font-size: 0.87rem;
    line-height: 1.85;
    color: #1e1a17;
    white-space: pre-wrap;
    margin: 0;
}

/* Pull requests to other people's projects, from js/contributions.js, which a
   GitHub Action (.github/workflows/contributions.yml) regenerates daily. */
#overlay-contrib-title {
    font-family: var(--font);
    font-size: 0.87rem;
    font-weight: 700;
    color: #0d0a07;
    margin: 1.4rem 0 0.2rem;
}

#overlay-contrib-list { list-style: none; white-space: normal; }
#overlay-contrib-list li + li { margin-top: 0.25rem; }

.overlay-divider {
    height: 1px;
    background: var(--purple);
    opacity: 0.2;
    margin: 1.8rem 0;
    flex-shrink: 0;
}

.overlay-section-why {
    font-family: var(--font);
    font-size: 0.85rem;
    line-height: 1.9;
    color: #2e2a27;
    white-space: pre-wrap;
    font-style: italic;
    border-left: 2px solid var(--purple);
    padding-left: 1.1rem;
    margin: 0;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(115,31,161,0.3); border-radius: 2px; }

#overlay-info-side *::selection     { background: #731fa1; color: #ffffff; }
#overlay-info-side *::-moz-selection { background: #731fa1; color: #ffffff; }

#overlay-back {
    position: absolute;
    top: 1.4rem;
    left: 1.6rem;
    z-index: 2;
    background: none;
    border: none;
    color: var(--white);
    font-family: var(--font);
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.38;
    cursor: pointer;
    padding: 0.4rem 0;
    transition: opacity 0.18s;
}
#overlay-back:hover { opacity: 1; }

@media (max-width: 680px) {
    #overlay-inner { flex-direction: column; overflow-y: auto; }
    #overlay-card-side {
        width: 100%;
        flex-shrink: 0;
        height: 52vw;
        min-height: 220px;
        max-height: 320px;
    }
    #overlay-card-3d { width: clamp(120px, 36vw, 180px); }
    #overlay-info-side { flex: 1; padding: 2rem 1.6rem 2.4rem; overflow-y: visible; }
    #overlay-card-name { font-size: clamp(1.3rem, 6vw, 2rem); }
    #overlay-back { top: 0.8rem; left: 1rem; }
}
    </style>
</head>
<body>

<!-- SCREEN 1: PACK -->
<div id="screen-pack">
    <div id="pack-env" aria-hidden="true">
        <div id="pack-dim"></div>
    </div>
    <canvas id="pack-canvas" aria-hidden="true"></canvas>
    <img id="pack-fallback" src="img/pack-front.jpg" alt="" hidden>
    <div id="pack-intro">
        <h1 id="pack-name">Jonathan Thamrin</h1>
        <p id="pack-role">Final-year computer science student at UNSW specialising in
        security engineering. Looking for graduate roles in cybersecurity and software.</p>
    </div>
    <p id="pack-trace" aria-hidden="true">Trace line to open</p>
    <button id="pack-open-btn" type="button">Open the pack</button>
</div>

<!-- SCREEN 2: CAROUSEL -->
<div id="screen-carousel">
    <div id="carousel-stage">
        <div id="carousel-track"></div>
    </div>
    <div id="card-label">
        <div id="card-label-typeline"></div>
        <div id="card-label-name"></div>
    </div>
    <div id="contact-links">
        <a href="https://github.com/jonbttt" target="_blank" rel="noopener">GitHub</a>
        <a href="https://linkedin.com/in/jonbttt" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://moxfield.com/users/jonbttt" target="_blank" rel="noopener">Moxfield</a>
    </div>
</div>

<!-- OVERLAY -->
<div id="overlay">
    <div id="overlay-backdrop"></div>
    <div id="overlay-inner">
        <button id="overlay-back" aria-label="Back">&#8592; back</button>
        <div id="overlay-card-side">
            <div id="overlay-card-3d">
                <div id="overlay-card-inner">
                    <div id="overlay-card-front">
                        <img id="overlay-front-img" src="" alt="" />
                        <div id="overlay-card-shine"></div>
                    </div>
                    <div id="overlay-card-back-face">
                        <img src="img/cardback.png" alt="Card Back" />
                    </div>
                </div>
            </div>
            <p id="overlay-flip-hint">click to flip</p>
        </div>
        <div id="overlay-info-side">
            <div id="overlay-card-name"></div>
            <div id="overlay-type-line"></div>
            <p id="overlay-section1" class="overlay-section-text"></p>
            <div id="overlay-contrib" hidden>
                <h3 id="overlay-contrib-title">Open-source contributions</h3>
                <ul id="overlay-contrib-list" class="overlay-section-text"></ul>
            </div>
            <div class="overlay-divider"></div>
            <p id="overlay-section2" class="overlay-section-why"></p>
        </div>
    </div>
</div>

<script src="js/contributions.js"></script>
<script>
'use strict';

// ── CARD DATA ──
const CARDS = [
    {
        img: 'img/card-1.png',
        name: 'About Me',
        typeLine: 'Goblin Engineer',
        about: 'Hey, I\'m Jonathan! I\'m currently a final-year CS student at UNSW specialising in Security Engineering, graduating September 2026. Previously Software Engineer at The Golfer Network and AI Engineer at PT Wide Technologies Indonesia. Now, I\'m looking for grad roles in cybersecurity and software development. Nice to meet ya!',
        why: 'I chose Goblin Engineer as my face card because its flavor truly fits me. He\'s a tinkerer. The art shows someone surrounded by their work, actively in the middle of it. In terms of function, the Goblin Engineer puts an artifact into the graveyard and recurs a different one from it; build something, break it, pull out something more useful. This is my process within security engineering, and something I genuinely love doing.'
    },
    {
        img: 'img/card-2.png',
        name: 'Projects',
        typeLine: 'Mizzix of the Izmagnus',
        about: 'Sentinel Honeypot - A high-interaction SSH honeypot on Azure running real OpenSSH, wired to Microsoft Sentinel through auditd and a repurposed build of rk-veil acting as a kernel-space keylogger. Five custom KQL detection rules, each with entity mapping and MITRE ATT&CK tagging. It caught a live IoT botnet intrusion within hours of going up. <a href="./blog/sentinel-honeypot.html">Writeup</a>\nWard-XDP (in progress) - An inline eBPF/XDP intrusion prevention system that drops flood traffic at the network driver before the kernel ever sees it. SYN flood detection is complete and benchmarked at ~51ns per packet. Written in C with a Go control plane. <a href="https://github.com/jonbttt/Ward-XDP" target="_blank" rel="noopener">GitHub</a>\nrk-veil - A Linux kernel module rootkit built from scratch. Syscall hooking, process hiding, and privilege escalation on kernel 6.x, with every technique mapped to MITRE ATT&CK and its detection surface documented. Presented at SCONES 2026. <a href="https://github.com/jonbttt/rk-veil" target="_blank" rel="noopener">GitHub</a>\nStegSweeper - My first security project. Hides an AES-128 encrypted message inside a playable Minesweeper board, where the mine layout is the ciphertext. <a href="https://github.com/jonbttt/stegsweeper" target="_blank" rel="noopener">GitHub</a>',
        contributions: true,
        why: 'Mizzix\'s ability lets you get an experience counter every time you cast an instant or sorcery with a mana cost greater than the number of counters you have, and those counters reduce the cost of future spells. The more I\'ve done, the easier the next thing becomes.'
    },
    {
        img: 'img/card-3.png',
        name: 'Experience',
        typeLine: 'Snapcaster Mage',
        about: 'UNSW - Scrum Master for a team of developers building a mixed reality application for a UNSW professor. Led sprint planning, managed delivery, and contributed to the Unity codebase directly.\nThe Golfer Network - Software Engineer building full-stack products. Worked across the entire delivery pipeline and meaningfully reduced backend turnaround time in production.\nWide Technologies Indonesia - AI Engineer working with and learning LLMs, computer vision, and machine learning pipelines.',
        why: 'I chose Snapcaster Mage mainly because of the mechanic, flashback. Flashback allows me to cast that instant or sorcery from my graveyard and exiles it, allowing me to reuse something I previously casted. My experiences act in the same way that I\'m able to reuse them for whatever comes next.'
    },
    {
        img: 'img/card-4.png',
        name: 'Lifting',
        typeLine: 'Zilortha, Strength Incarnate',
        about: 'After a busy day, I always love training. I\'m an amateur powerlifter in the 72kg weight class with around 2.5 yrs of training. I plan on competing soon this year in powerlifting and joining an amateur bodybuilding comp sometime next year.',
        why: 'Zilortha makes your creatures deal damage based on power rather than toughness, raw strength over endurance. That\'s what powerlifting is to me. Also, I\'m a Godzilla fan.'
    },
    {
        img: 'img/card-5.png',
        name: 'Hobbies',
        typeLine: 'Mox Amber',
        about: 'I\'m an Avid MTG player, mainly Commander with friends and Arena on downtime. You can view my Commander decks on my Moxfield: moxfield.com/users/jonbttt (It\'s also linked below in the previous section). I\'m also a big video game nerd with my top 5 being Factorio, Stellaris, Cruelty Squad, Risk of Rain 2, and Deadlock. Other than that, I enjoy fishing, thrifting, and cafe-hopping with friends.',
        why: 'A Mox is a 0-cost artifact that generates value as soon as it comes down. I specifically chose the Mox Amber as it has an added prerequisite that felt right. Hobbies only show up fully when everything else (the work, the training, the ambition) is already there.'
    },
    {
        img: 'img/card-6.png',
        name: 'Travelling',
        typeLine: 'Explore',
        about: 'Originally from Jakarta, now based in Sydney. I\'ve travelled across Asia and parts of Europe. In the coming months, I really hope I\'ll be able to see more of Australia (I\'d love to go hiking around Kosciuszko National Park and visit Uluru one day).',
        why: 'This card speaks for itself, both in terms of the card\'s function and flavor.'
    }
];

// Preload images so they're cached before the carousel builds
(function preloadImages() {
    CARDS.forEach(card => { const i = new Image(); i.src = card.img; });
    const b = new Image(); b.src = 'img/cardback.png';
}());

const N          = CARDS.length;
const CARD_ANGLE = 360 / N;
const TILT_X     = -5;
const RADIUS     = 658;
const DRAG_DEG   = 0.36;

// ── PACK → CAROUSEL HAND-OFF ──
// js/pack.js runs the 3D pack. Once the first card has risen out of it, the
// carousel is built underneath, the card glides into its front slot, and the
// pack screen hands over.
const carScreen = document.getElementById('screen-carousel');
let handoffFront = null;

window.PackHandoff = {
    tiltX: TILT_X,
    prepare(hideFront) {
        carRotation  = 0;
        carTargetRot = 0;
        buildCarousel();
        applyTrackTransform();
        updateLabel();
        carScreen.style.opacity = '0';
        carScreen.style.display = 'block';
        handoffFront = carouselTrack.querySelector('.c-card[data-index="0"] .c-face-front');
        if (hideFront) handoffFront.style.visibility = 'hidden';
        // Where the front card's centre lands and how wide it is there, from
        // the ring's geometry. Its bounding box is a little bigger than the
        // card, since the tilt brings the top edge forward.
        const st = carouselStage.getBoundingClientRect();
        const t  = TILT_X * Math.PI / 180;
        const p  = parseFloat(getComputedStyle(carouselStage).perspective);
        const s  = p / (p - RADIUS * (Math.cos(t) - 1));
        return {
            x: st.left + st.width / 2,
            y: st.top + st.height / 2 - RADIUS * Math.sin(t) * s,
            width: handoffFront.offsetWidth * s,
        };
    },
    reveal(ms) {
        carScreen.style.transition = `opacity ${ms}ms ease`;
        carScreen.style.opacity = '1';
    },
    finish() {
        if (handoffFront) handoffFront.style.visibility = '';
        document.getElementById('screen-pack').style.display = 'none';
        carScreen.style.transition = '';
    },
};

// ── CAROUSEL ──
const carouselStage = document.getElementById('carousel-stage');
const carouselTrack = document.getElementById('carousel-track');
const cardLabel     = document.getElementById('card-label');
const labelTypeline = document.getElementById('card-label-typeline');
const labelName     = document.getElementById('card-label-name');

let carRotation  = 0;
let carTargetRot = 0;
let carDragging  = false;
let carDragX0    = 0;
let carDragY0    = 0;
let carDragRot0  = 0;

function buildCarousel() {
    carouselTrack.innerHTML = '';
    const cardW = Math.max(260, Math.min(window.innerWidth * 0.292, 390));
    const cardH = cardW * (7 / 5);

    CARDS.forEach((data, i) => {
        const slot = document.createElement('div');
        slot.className     = 'c-card';
        slot.dataset.index = i;
        slot.style.marginLeft = `${-cardW / 2}px`;
        slot.style.marginTop  = `${-cardH / 2}px`;
        slot.style.transform  = `rotateY(${i * CARD_ANGLE}deg) translateZ(${RADIUS}px)`;

        const front = document.createElement('div');
        front.className = 'c-face c-face-front';
        const fImg = document.createElement('img');
        fImg.src = data.img; fImg.alt = data.name;
        front.appendChild(fImg);

        const back = document.createElement('div');
        back.className = 'c-face c-face-back';
        const bImg = document.createElement('img');
        bImg.src = 'img/cardback.png'; bImg.alt = 'Card Back';
        back.appendChild(bImg);

        slot.appendChild(front);
        slot.appendChild(back);
        carouselTrack.appendChild(slot);
    });
}

function applyTrackTransform() {
    carouselTrack.style.transform = `translateZ(${-RADIUS}px) rotateX(${TILT_X}deg) rotateY(${carRotation}deg)`;
}

function getActiveIndex() {
    const steps = Math.round(-carRotation / CARD_ANGLE);
    return ((steps % N) + N) % N;
}

function updateLabel() {
    const steps       = -carRotation / CARD_ANGLE;
    const nearestStep = Math.round(steps);
    const activeIdx   = ((nearestStep % N) + N) % N;
    const drift       = Math.abs(steps - nearestStep);

    labelTypeline.textContent = CARDS[activeIdx].typeLine;
    labelName.textContent     = CARDS[activeIdx].name;
    cardLabel.style.opacity   = Math.max(0, 1 - drift * 3.5);

    carouselTrack.querySelectorAll('.c-card').forEach((el, i) => {
        const raw      = ((i * CARD_ANGLE + carRotation) % 360 + 360) % 360;
        const fromFront = raw > 180 ? 360 - raw : raw;
        el.style.pointerEvents = fromFront < 95 ? 'auto' : 'none';
    });
}

const SNAP_EASE = 'transform 0.38s cubic-bezier(0.22, 1, 0.36, 1)';
let snapTimer = null;

function snapWithTransition() {
    carouselTrack.style.transition = SNAP_EASE;
    carRotation = carTargetRot;
    applyTrackTransform();
    updateLabel();
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => { carouselTrack.style.transition = ''; }, 420);
}

function snapToNearest() {
    carTargetRot = Math.round(carRotation / CARD_ANGLE) * CARD_ANGLE;
    snapWithTransition();
}

function snapToCard(idx) {
    const activeIdx  = getActiveIndex();
    const delta_raw  = (activeIdx - idx + N) % N;
    const delta      = delta_raw > N / 2 ? delta_raw - N : delta_raw;
    carTargetRot     = (Math.round(carRotation / CARD_ANGLE) + delta) * CARD_ANGLE;
    snapWithTransition();
}

function onCarDragStart(x, y) {
    clearTimeout(snapTimer);
    carouselTrack.style.transition = '';
    carDragging = true;
    carDragX0   = x;
    carDragY0   = y;
    carDragRot0 = carRotation;
    carouselStage.classList.add('grabbing');
}

function onCarDragMove(x) {
    if (!carDragging) return;
    carRotation = carDragRot0 + (x - carDragX0) * DRAG_DEG;
    applyTrackTransform();
    updateLabel();
}

function onCarDragEnd(x, y, target) {
    if (!carDragging) return;
    carDragging = false;
    carouselStage.classList.remove('grabbing');

    const dx = Math.abs(x - carDragX0);
    const dy = Math.abs(y - carDragY0);

    if (dx < 8 && dy < 8) {
        const slot = target?.closest?.('.c-card');
        if (slot) {
            const clickedIdx = parseInt(slot.dataset.index);
            const activeIdx  = getActiveIndex();
            if (clickedIdx === activeIdx) { snapToNearest(); openOverlay(activeIdx); return; }
            snapToCard(clickedIdx);
            return;
        }
    }
    snapToNearest();
}

carouselStage.addEventListener('mousedown', (e) => { e.preventDefault(); onCarDragStart(e.clientX, e.clientY); });
document.addEventListener('mousemove',  (e) => { if (carDragging) onCarDragMove(e.clientX); });
document.addEventListener('mouseup',    (e) => { if (carDragging) onCarDragEnd(e.clientX, e.clientY, e.target); });

carouselStage.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    onCarDragStart(t.clientX, t.clientY);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
    if (carDragging) onCarDragMove(e.touches[0].clientX);
}, { passive: true });
document.addEventListener('touchend', (e) => {
    if (!carDragging) return;
    const t = e.changedTouches[0];
    onCarDragEnd(t.clientX, t.clientY, document.elementFromPoint(t.clientX, t.clientY));
});

// ── OVERLAY ──
const overlay         = document.getElementById('overlay');
const overlayBackdrop = document.getElementById('overlay-backdrop');
const overlayCName    = document.getElementById('overlay-card-name');
const overlayTLine    = document.getElementById('overlay-type-line');
const overlayS1       = document.getElementById('overlay-section1');
const overlayS2       = document.getElementById('overlay-section2');
const overlayFrontImg = document.getElementById('overlay-front-img');
const overlayCardInn  = document.getElementById('overlay-card-inner');
const overlayCardSide = document.getElementById('overlay-card-side');
const overlayShine    = document.getElementById('overlay-card-shine');
const flipHint        = document.getElementById('overlay-flip-hint');

const overlayContrib  = document.getElementById('overlay-contrib');
const contribList     = document.getElementById('overlay-contrib-list');
const monthFmt        = new Intl.DateTimeFormat('en-AU', { month: 'short', year: 'numeric' });

// One line each, in the projects' "Name - description. Link" shape. Built as
// text nodes, since the titles come from GitHub.
function renderContributions(list) {
    contribList.replaceChildren(...list.map((c) => {
        const li = document.createElement('li');
        const status = c.status === 'merged'
            ? `Merged ${monthFmt.format(new Date(c.date))}`
            : 'In review';
        const a = document.createElement('a');
        a.href = c.url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = `PR #${c.number}`;
        li.append(`${c.repo} - ${c.title.replace(/\.$/, '')}. ${status}. `, a);
        return li;
    }));
    overlayContrib.hidden = !list.length;
}

let isFlipped = false;

// Every state uses the same transform list, so transitions interpolate angle by
// angle. The tilt comes first so it stays in screen space: after the flip it
// otherwise acted in the card's mirrored frame and tipped the wrong way.
const cardTransform = (rx = 0, ry = 0) => `rotateX(${rx}deg) rotateY(${(isFlipped ? 180 : 0) + ry}deg)`;

function openOverlay(idx) {
    const d = CARDS[idx];
    isFlipped = false;
    overlayCardInn.classList.remove('flipped');
    overlayCardInn.style.transform  = cardTransform();
    overlayCardInn.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
    overlayFrontImg.src      = d.img;
    overlayCName.textContent = d.name;
    overlayTLine.textContent = d.typeLine;
    overlayS1.innerHTML      = d.about.replace(/\n{2,}/g, '\n');
    overlayS2.innerHTML      = d.why.replace(/\n{2,}/g, '\n');
    renderContributions(d.contributions ? window.CONTRIBUTIONS || [] : []);
    flipHint.textContent     = 'click to flip';
    overlay.classList.add('active');
    overlay.style.display    = 'flex';
}

function closeOverlay() {
    overlay.classList.remove('active');
    overlay.style.display   = 'none';
    isFlipped               = false;
    overlayCardInn.classList.remove('flipped');
    overlayCardInn.style.transform = cardTransform();
    overlayShine.style.background  = '';

    const screenCar = document.getElementById('screen-carousel');
    screenCar.classList.remove('revealing');
    screenCar.offsetHeight;
    screenCar.classList.add('revealing');
    setTimeout(() => screenCar.classList.remove('revealing'), 300);
}

overlayBackdrop.addEventListener('click', closeOverlay);
document.getElementById('overlay-back').addEventListener('click', closeOverlay);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay(); });

overlayCardSide.addEventListener('click', (e) => {
    e.stopPropagation();
    isFlipped = !isFlipped;
    overlayCardInn.classList.toggle('flipped', isFlipped);
    overlayCardInn.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
    overlayCardInn.style.transform  = cardTransform();
});

overlayCardSide.addEventListener('mousemove', (e) => {
    const rect  = overlayCardSide.getBoundingClientRect();
    const dx    = (e.clientX - rect.left - rect.width  / 2) / (rect.width  / 2);
    const dy    = (e.clientY - rect.top  - rect.height / 2) / (rect.height / 2);
    const clamp = (v,a,b) => Math.min(Math.max(v,a),b);
    const rx    = clamp(-dy * 12, -12, 12);
    const ry    = clamp( dx * 12, -12, 12);
    overlayCardInn.style.transition = 'transform 0.08s ease-out';
    overlayCardInn.style.transform  = cardTransform(rx, ry);
    const mx  = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    const my  = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    const hue = (parseFloat(mx) / 100 * 300 + parseFloat(my) / 100 * 150) % 360;
    overlayShine.style.background =
        `radial-gradient(circle at ${mx}% ${my}%,` +
        `rgba(255,255,255,0.24) 0%,` +
        `hsla(${hue},100%,72%,0.14) 22%,` +
        `hsla(${(hue+70)%360},100%,68%,0.08) 44%,` +
        `transparent 66%)`;
});

overlayCardSide.addEventListener('mouseleave', () => {
    overlayCardInn.style.transition = 'transform 0.5s ease';
    overlayCardInn.style.transform  = cardTransform();
    overlayShine.style.background   = '';
});

document.getElementById('overlay-info-side').addEventListener('click', (e) => e.stopPropagation());
</script>
