<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
/* ─── Reset ─── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg:     #0d0a07;
    --purple: #731fa1;
    --white:  #ffffff;
    --font:   'Averia Serif Libre', Georgia, serif;
}

html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font);
    color: var(--white);
    -webkit-user-select: none;
    user-select: none;
}

/* ═══════════════════════════════
   SCREEN 1 — PACK
═══════════════════════════════ */
#screen-pack {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    gap: 1.4rem;
    z-index: 1;
}

#pack-container {
    position: relative;
    width: clamp(150px, 16vw, 220px);
    aspect-ratio: 3 / 4.2;
}

#pack-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    border-radius: 8px;
    pointer-events: none;
    -webkit-user-drag: none;
    z-index: 1;
}

/* Foil layers */
#pack-foil-rainbow {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    z-index: 2;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.15;
    background: linear-gradient(
        135deg,
        hsla(0,100%,70%,1) 0%,
        hsla(52,100%,70%,1) 14%,
        hsla(120,100%,70%,1) 28%,
        hsla(180,100%,70%,1) 43%,
        hsla(240,100%,70%,1) 57%,
        hsla(290,100%,70%,1) 71%,
        hsla(320,100%,70%,1) 85%,
        hsla(360,100%,70%,1) 100%
    );
    transition: transform 0.15s ease;
}

#pack-foil-highlight {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    z-index: 3;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 35%, transparent 65%);
}

/* Drag zone — top 20% */
#pack-drag-zone {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 20%;
    z-index: 10;
    cursor: crosshair;
    border-radius: 8px 8px 0 0;
}

#pack-drag-glow {
    position: absolute;
    top: 0;
    width: 52px; height: 100%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(115,31,161,0.95) 0%, rgba(115,31,161,0.4) 45%, transparent 75%);
    filter: blur(5px);
    pointer-events: none;
    display: none;
    z-index: 11;
}

#pack-progress {
    position: absolute;
    bottom: -7px; left: 8%; right: 8%;
    height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 1px;
    overflow: hidden;
    display: none;
    z-index: 11;
}

#pack-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(115,31,161,0.5), #9b4fd6, #c090f0);
    border-radius: 1px;
    box-shadow: 0 0 10px rgba(115,31,161,0.9);
    transition: width 0.04s linear;
}

#pack-hint {
    font-family: var(--font);
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    color: var(--white);
    opacity: 0.28;
    pointer-events: none;
    margin-top: 0.2rem;
}

/* Tear portal */
#tear-top, #tear-bottom {
    position: fixed;
    pointer-events: none;
    z-index: 80;
    overflow: hidden;
}

/* Particle */
.particle {
    position: fixed;
    pointer-events: none;
    z-index: 90;
    animation: particleFly var(--dur, 0.7s) ease-out forwards;
}

@keyframes particleFly {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot,200deg)); opacity: 0; }
}

/* Scene flash */
#scene-flash {
    position: fixed;
    inset: 0;
    background: var(--purple);
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    display: none;
}

/* ═══════════════════════════════
   SCREEN 2 — CAROUSEL
═══════════════════════════════ */
#screen-carousel {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    overflow: hidden;
}

#carousel-stage {
    position: absolute;
    inset: 0;
    bottom: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
    perspective-origin: 50% 50%;
    cursor: grab;
}

#carousel-stage.grabbing { cursor: grabbing; }

#carousel-inner {
    position: relative;
    width: 0; height: 0;
    transform-style: preserve-3d;
}

.c-card {
    position: absolute;
    width: clamp(155px, 17vw, 230px);
    aspect-ratio: 5 / 7;
    border-radius: 4.5%;
    overflow: hidden;
    cursor: pointer;
    will-change: transform, opacity;
    -webkit-user-drag: none;
    backface-visibility: hidden;
    box-shadow: 0 20px 70px rgba(0,0,0,0.65);
}

.c-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
}

/* Label area */
#card-label {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.2s;
}

#card-label-typeline {
    font-family: var(--font);
    font-size: 0.58rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0.4;
    margin-bottom: 0.35rem;
    font-variant: small-caps;
}

#card-label-name {
    font-family: var(--font);
    font-size: clamp(1.3rem, 2.4vw, 2.1rem);
    font-weight: 400;
    color: var(--white);
    letter-spacing: 0.03em;
    line-height: 1.1;
}

/* Contact links */
#contact-links {
    position: absolute;
    bottom: 26px;
    right: 32px;
    display: flex;
    gap: 1.6rem;
}

#contact-links a {
    font-family: var(--font);
    font-size: 0.6rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0.35;
    text-decoration: none;
    transition: opacity 0.2s;
}

#contact-links a:hover { opacity: 1; }

/* ═══════════════════════════════
   OVERLAY
═══════════════════════════════ */
#overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: none;
}

#overlay.active { display: flex; }

#overlay-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(5,3,2,0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    cursor: pointer;
}

#overlay-inner {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100%;
    height: 100%;
    animation: overlayFadeIn 0.3s ease both;
}

@keyframes overlayFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
}

/* Left — card */
#overlay-card-side {
    width: 45%;
    flex-shrink: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

#overlay-card-3d {
    position: relative;
    width: clamp(170px, 20vw, 280px);
    aspect-ratio: 5 / 7;
    perspective: 800px;
    z-index: 1;
}

#overlay-card-inner {
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    will-change: transform;
}

#overlay-card-inner.flipped { transform: rotateY(180deg); }

#overlay-card-front, #overlay-card-back-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 4.5%;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.85);
}

#overlay-card-front img,
#overlay-card-back-face img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    -webkit-user-drag: none;
}

#overlay-card-back-face { transform: rotateY(180deg); }

#overlay-card-shine {
    position: absolute;
    inset: 0;
    border-radius: 4.5%;
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: screen;
}

#overlay-flip-hint {
    position: absolute;
    bottom: 1.6rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font);
    font-size: 0.56rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    white-space: nowrap;
    animation: pulse 2.8s ease-in-out infinite;
    pointer-events: none;
}

@keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.65} }

/* Right — info */
#overlay-info-side {
    flex: 1;
    background: var(--white);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 3.5rem 3.2rem 3rem;
    cursor: default;
}

#overlay-info-side::-webkit-scrollbar { width: 3px; }
#overlay-info-side::-webkit-scrollbar-thumb { background: rgba(115,31,161,0.25); border-radius: 2px; }

#overlay-card-name {
    font-family: var(--font);
    font-size: clamp(1.7rem, 2.8vw, 2.6rem);
    font-weight: 700;
    color: #0d0a07;
    line-height: 1.05;
    margin-bottom: 0.45rem;
}

#overlay-type-line {
    font-family: var(--font);
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: #0d0a07;
    opacity: 0.3;
    margin-bottom: 2.2rem;
}

.overlay-section-text {
    font-family: var(--font);
    font-size: 0.87rem;
    line-height: 1.85;
    color: #1e1a17;
    margin: 0;
}

.overlay-divider {
    height: 1px;
    background: var(--purple);
    opacity: 0.2;
    margin: 1.8rem 0;
    flex-shrink: 0;
}

.overlay-section-why {
    font-family: var(--font);
    font-size: 0.85rem;
    line-height: 1.9;
    color: #2e2a27;
    font-style: italic;
    border-left: 2px solid var(--purple);
    padding-left: 1.1rem;
    margin: 0;
}

/* Scrollbar for body */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(115,31,161,0.3); border-radius: 2px; }
    </style>
</head>
<body>

<!-- Tear portal + flash -->
<div id="tear-top"></div>
<div id="tear-bottom"></div>
<div id="scene-flash"></div>

<script>
'use strict';

/* ─────────────────────────────────────────────
   CARD DATA
───────────────────────────────────────────── */
const CARDS = [
    {
        img: 'img/card-1.png',
        name: 'Arcum Dagsson',
        typeLine: 'Legendary Creature — About me',
        about: 'Final-year CS student at UNSW specialising in Security Engineering, graduating December 2026. Software Engineer at The Golfer Network. Previously AI Engineer at PT Wide Technologies in Indonesia. Targeting grad roles in cybersecurity and tech risk advisory.',
        why: 'Arcum Dagsson dismantles existing artifacts to tutor out more powerful ones from his library. That is exactly what security engineering is — you take apart systems to understand them, then build something more dangerous. The blue mana cost, the artificer identity, the methodical destruction-as-construction. It fit immediately.'
    },
    {
        img: 'img/card-2.png',
        name: 'Snapcaster Mage',
        typeLine: 'Instant — Field Experience',
        about: 'Software Engineer at The Golfer Network building full-stack products. Previously AI Engineer at PT Wide Technologies. Projects include a Meta Quest 3 mixed reality app in Unity, a home lab SIEM with ELK Stack and OTX AlienVault, and a Linux kernel rootkit.',
        why: 'Snapcaster Mage gives flashback to instants and sorceries — he makes past experience immediately useful again. Every role I have taken has fed directly into the next one. The ability to reach back into what you have already done and cast it again at the right moment is what good engineering experience actually looks like.'
    },
    {
        img: 'img/card-3.png',
        name: 'Goblin Engineer',
        typeLine: 'Creature — Side Projects',
        about: 'rk-veil — Linux kernel module rootkit, syscall hooking and process hiding on kernel v6. Home Lab SIEM — ELK Stack with OTX AlienVault threat intelligence and Jira integration. MR Sandbox — Meta Quest 3 mixed reality chemistry education app in Unity.',
        why: 'Goblin Engineer puts an artifact into the graveyard and recurs a different one from it. Build something, break it, pull out something more dangerous. That loop of building, breaking, and rebuilding is exactly how side projects work — especially in security. The workshop chaos of the art is accurate.'
    },
    {
        img: 'img/card-4.png',
        name: 'Zilortha, Strength Incarnate',
        typeLine: 'Legendary Creature — Lifting',
        about: 'Competitive powerlifter, 72kg weight class, about 2.5 years of serious training. Currently cutting. Tracking macros, optimising sleep, dialling in nutrition around training. Main lifts squat, bench, deadlift.',
        why: 'Zilortha makes your creatures assign combat damage using power rather than toughness. It does not matter how much you can absorb — what matters is how hard you hit. That is the mindset of powerlifting. The card is a 10/10. The art is an unstoppable dinosaur. There is no subtext.'
    },
    {
        img: 'img/card-5.png',
        name: 'Mox Amber',
        typeLine: 'Artifact — MTG',
        about: 'Avid MTG player, mainly Commander with friends and Arena on downtime. Currently running 5 decks. Moxfield: moxfield.com/users/jonbttt',
        why: 'A Mox costs nothing and generates value immediately. Mox Amber specifically taps for mana if you control a legendary creature or planeswalker — it only works when something meaningful is already in play. MTG is the zero-cost thing I show up for that only works because everything else is already there.'
    },
    {
        img: 'img/card-6.png',
        name: 'Explore',
        typeLine: 'Sorcery — Travel',
        about: 'Travelled across Southeast Asia, East Asia, and beyond. Originally from Indonesia, based in Sydney. Always looking for the next stamp.',
        why: 'Explore lets you play an extra land and draws a card if you cannot — it makes the unknown productive. Every place changes how you see the next one. The mechanic of moving further and gaining something regardless of what you find is exactly how travel works.'
    }
];

/* ─────────────────────────────────────────────
   SCREEN 1 — PACK OPENING
───────────────────────────────────────────── */
const packContainer  = document.getElementById('pack-container');
const packImg        = document.getElementById('pack-img');
const packFoilR      = document.getElementById('pack-foil-rainbow');
const packFoilH      = document.getElementById('pack-foil-highlight');
const packDragZone   = document.getElementById('pack-drag-zone');
const packDragGlow   = document.getElementById('pack-drag-glow');
const packProgress   = document.getElementById('pack-progress');
const packProgressBar= document.getElementById('pack-progress-bar');
const tearTop        = document.getElementById('tear-top');
const tearBot        = document.getElementById('tear-bottom');
const sceneFlash     = document.getElementById('scene-flash');

let packOpened  = false;
let packDragging= false;
let packDragX0  = 0;
let packDragCur = 0;
const PACK_THRESHOLD = 0.70;

/* Foil idle animation */
let idleT    = 0;
let idleRAF  = null;
let isIdle   = true;
let idleTimer= null;

function updatePackFoil(mx, my) {
    const hue = (mx / 100 * 280 + my / 100 * 120) % 360;
    packFoilH.style.background =
        `radial-gradient(circle at ${mx}% ${my}%,` +
        `rgba(255,255,255,0.26) 0%,` +
        `hsla(${hue},100%,75%,0.13) 22%,` +
        `hsla(${(hue+80)%360},100%,70%,0.08) 42%,` +
        `transparent 64%)`;
    packFoilR.style.transform = `rotate(${mx * 1.4}deg)`;
}

function idleTick() {
    if (!isIdle || packOpened) return;
    idleT += 0.007;
    const mx = 50 + 36 * Math.sin(idleT * 1.15);
    const my = 50 + 28 * Math.sin(idleT * 0.73 + 0.6);
    updatePackFoil(mx, my);
    idleRAF = requestAnimationFrame(idleTick);
}

function goIdle() {
    isIdle = true;
    cancelAnimationFrame(idleRAF);
    idleRAF = requestAnimationFrame(idleTick);
}

function stopIdle() {
    isIdle = false;
    cancelAnimationFrame(idleRAF);
}

goIdle();

document.addEventListener('mousemove', (e) => {
    if (packOpened) return;
    const rect = packContainer.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
    const my = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);

    stopIdle();
    updatePackFoil(mx, my);

    clearTimeout(idleTimer);
    idleTimer = setTimeout(goIdle, 1600);
});

/* Drag mechanic */
function packDragStart(x) {
    if (packOpened) return;
    packDragging = true;
    packDragX0   = x;
    packDragCur  = x;
    packDragGlow.style.display = 'block';
    packProgress.style.display = 'block';
    stopIdle();
}

function packDragMove(x) {
    if (!packDragging || packOpened) return;
    packDragCur = x;
    const rect  = packContainer.getBoundingClientRect();
    const relX  = x - rect.left;
    const prog  = Math.max(0, Math.min(1, (x - packDragX0) / rect.width));

    packDragGlow.style.left = relX + 'px';
    packProgressBar.style.width = (prog * 100) + '%';

    if (prog >= PACK_THRESHOLD) completePack();
}

function packDragCancel() {
    if (!packDragging) return;
    packDragging = false;
    packDragGlow.style.display = 'none';
    packProgress.style.display = 'none';
    packProgressBar.style.width = '0%';
    goIdle();
}

function completePack() {
    if (packOpened) return;
    packOpened  = true;
    packDragging= false;
    packDragGlow.style.display = 'none';

    const rect = packContainer.getBoundingClientRect();
    const tearY = rect.top + rect.height * 0.05;
    const tearX = rect.left + rect.width / 2;

    spawnParticles(tearX, tearY);
    setTimeout(() => tearOpen(rect), 80);
}

/* Tear animation */
function tearOpen(rect) {
    const src  = packImg.src;
    const topH = rect.height * 0.05;
    const botH = rect.height - topH;

    tearTop.style.cssText =
        `width:${rect.width}px;height:${topH}px;` +
        `left:${rect.left}px;top:${rect.top}px;` +
        `border-radius:8px 8px 0 0;` +
        `transition:transform 0.55s cubic-bezier(.4,0,.2,1),opacity 0.28s ease 0.3s;`;
    tearTop.innerHTML =
        `<img src="${src}" style="width:100%;height:${rect.height}px;object-fit:fill;border-radius:8px;" />`;

    tearBot.style.cssText =
        `width:${rect.width}px;height:${botH}px;` +
        `left:${rect.left}px;top:${rect.top + topH}px;` +
        `border-radius:0 0 8px 8px;` +
        `transition:transform 0.55s cubic-bezier(.4,0,.2,1),opacity 0.28s ease 0.3s;`;
    tearBot.innerHTML =
        `<img src="${src}" style="width:100%;height:${rect.height}px;object-fit:fill;border-radius:8px;margin-top:-${topH}px;" />`;

    packImg.style.opacity = '0';
    packFoilR.style.opacity = '0';
    packFoilH.style.opacity = '0';
    packDragZone.style.display = 'none';

    requestAnimationFrame(() => requestAnimationFrame(() => {
        tearTop.style.transform = `translateY(-${topH + 130}px)`;
        tearTop.style.opacity   = '0';
        tearBot.style.transform = `translateY(${botH + 130}px)`;
        tearBot.style.opacity   = '0';
    }));

    setTimeout(cutToCarousel, 680);
}

function cutToCarousel() {
    tearTop.style.display = 'none';
    tearBot.style.display = 'none';

    /* Hard scene cut — single purple flash frame */
    sceneFlash.style.display  = 'block';
    sceneFlash.style.opacity  = '1';
    sceneFlash.style.transition = 'none';

    requestAnimationFrame(() => requestAnimationFrame(() => {
        document.getElementById('screen-pack').style.display = 'none';
        document.getElementById('screen-carousel').style.display = 'block';
        sceneFlash.style.transition = 'opacity 0.18s ease-out';
        sceneFlash.style.opacity    = '0';
        setTimeout(() => { sceneFlash.style.display = 'none'; }, 200);

        carTarget   = 0;
        carPosition = 0;
        carVelocity = 0;
        buildCarousel();
        updateCarousel();
        carSpring();
    }));
}

/* Particles — purple + white */
function spawnParticles(x, y) {
    const colors = ['#731fa1','#9b4fd6','#c090f0','#ffffff','#e8d4f8'];

    for (let i = 0; i < 28; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = (i / 28) * Math.PI * 2;
        const dist  = 55 + Math.random() * 170;
        const size  = 2 + Math.random() * 5;
        const dur   = (0.45 + Math.random() * 0.55).toFixed(2);
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.cssText =
            `left:${x}px;top:${y}px;` +
            `width:${size}px;height:${size * 3.2}px;` +
            `border-radius:2px;background:${color};` +
            `--tx:${(Math.cos(angle)*dist).toFixed(1)}px;` +
            `--ty:${(Math.sin(angle)*dist).toFixed(1)}px;` +
            `--dur:${dur}s;--rot:${Math.floor(Math.random()*360)}deg;` +
            `box-shadow:0 0 7px 2px ${color}88;`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), dur * 1000 + 200);
    }

    for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = Math.random() * Math.PI * 2;
        const dist  = 28 + Math.random() * 90;
        const size  = 10 + Math.random() * 18;
        const dur   = (0.35 + Math.random() * 0.4).toFixed(2);
        p.style.cssText =
            `left:${x}px;top:${y}px;` +
            `width:${size}px;height:${size}px;border-radius:50%;` +
            `background:radial-gradient(circle,rgba(179,100,240,0.9) 0%,rgba(115,31,161,0.4) 60%,transparent 100%);` +
            `--tx:${(Math.cos(angle)*dist).toFixed(1)}px;` +
            `--ty:${(Math.sin(angle)*dist).toFixed(1)}px;` +
            `--dur:${dur}s;` +
            `box-shadow:0 0 14px 5px rgba(115,31,161,0.5);`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), dur * 1000 + 200);
    }
}

/* Pack drag event wiring */
packDragZone.addEventListener('mousedown',  (e) => { e.preventDefault(); packDragStart(e.clientX); });
document.addEventListener('mousemove',      (e) => { if (packDragging) packDragMove(e.clientX); });
document.addEventListener('mouseup',        ()  => { if (packDragging) packDragCancel(); });
packDragZone.addEventListener('touchstart', (e) => { e.preventDefault(); packDragStart(e.touches[0].clientX); }, { passive: false });
document.addEventListener('touchmove',      (e) => { if (packDragging) { e.preventDefault(); packDragMove(e.touches[0].clientX); } }, { passive: false });
document.addEventListener('touchend',       ()  => { if (packDragging) packDragCancel(); });

/* ─────────────────────────────────────────────
   SCREEN 2 — 3D CAROUSEL
───────────────────────────────────────────── */
const carouselStage = document.getElementById('carousel-stage');
const carouselInner = document.getElementById('carousel-inner');
const cardLabel     = document.getElementById('card-label');
const labelTypeline = document.getElementById('card-label-typeline');
const labelName     = document.getElementById('card-label-name');

let carPosition = 0;
let carTarget   = 0;
let carVelocity = 0;
let carDragging = false;
let carDragX0   = 0;
let carDragY0   = 0;
let carDragPos0 = 0;
let carRAF      = null;
const DRAG_SCALE = 260; /* px per card step */

/* Card config — spacing and depth per offset */
function cardTransform(offset) {
    /* offset is float; positive = right of center */
    const abs = Math.abs(offset);

    /* Horizontal spacing — wider than card width so ±2 clips viewport */
    const tx = offset * 235;

    /* Depth — push side cards back on Z (parabolic) */
    const tz = -(abs * abs) * 52;

    /* Rotation */
    const ry = offset * 25;

    /* Opacity — 0→1, 1→0.75, 2→0.5, clamp beyond */
    let op;
    if      (abs <= 1) op = 1 - abs * 0.25;
    else if (abs <= 2) op = 0.75 - (abs - 1) * 0.25;
    else               op = Math.max(0, 0.5 - (abs - 2) * 0.5);

    /* Z-index — center card on top */
    const zi = Math.round(10 - abs * 3);

    return { tx, tz, ry, op, zi };
}

function buildCarousel() {
    carouselInner.innerHTML = '';
    CARDS.forEach((data, i) => {
        const el = document.createElement('div');
        el.className    = 'c-card';
        el.dataset.index= i;
        const img       = document.createElement('img');
        img.src         = data.img;
        img.alt         = data.name;
        el.appendChild(img);
        carouselInner.appendChild(el);
    });
}

function updateCarousel() {
    const els = carouselInner.querySelectorAll('.c-card');
    els.forEach((el, i) => {
        const offset = i - carPosition;
        const abs    = Math.abs(offset);

        if (abs > 2.6) {
            el.style.opacity        = '0';
            el.style.pointerEvents  = 'none';
            return;
        }

        const { tx, tz, ry, op, zi } = cardTransform(offset);
        el.style.transform      = `translate(-50%,-50%) translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg)`;
        el.style.opacity        = op;
        el.style.zIndex         = zi;
        el.style.pointerEvents  = abs < 2.5 ? 'auto' : 'none';
    });

    /* Update label — snap to nearest */
    const ci = Math.round(carPosition);
    const clamped = Math.max(0, Math.min(CARDS.length - 1, ci));
    labelTypeline.textContent = CARDS[clamped].typeLine;
    labelName.textContent     = CARDS[clamped].name;

    /* Fade label when mid-drag between cards */
    const drift = Math.abs(carPosition - ci);
    cardLabel.style.opacity = Math.max(0, 1 - drift * 2.8);
}

function carSpring() {
    if (carDragging) { carRAF = requestAnimationFrame(carSpring); return; }

    const diff = carTarget - carPosition;
    if (Math.abs(diff) < 0.00008 && Math.abs(carVelocity) < 0.00008) {
        carPosition = carTarget;
        carVelocity = 0;
        updateCarousel();
        return;
    }

    carVelocity = carVelocity * 0.76 + diff * 0.13;
    carPosition += carVelocity;
    updateCarousel();
    carRAF = requestAnimationFrame(carSpring);
}

/* Carousel drag */
function onCarDragStart(x, y) {
    carDragging  = true;
    carDragX0    = x;
    carDragY0    = y;
    carDragPos0  = carPosition;
    cancelAnimationFrame(carRAF);
    carouselStage.classList.add('grabbing');
}

function onCarDragMove(x) {
    if (!carDragging) return;
    const dx     = x - carDragX0;
    carPosition  = Math.max(0, Math.min(CARDS.length - 1, carDragPos0 - dx / DRAG_SCALE));
    updateCarousel();
}

function onCarDragEnd(x, y, target) {
    if (!carDragging) return;
    carDragging = false;
    carouselStage.classList.remove('grabbing');

    const dx = Math.abs(x - carDragX0);
    const dy = Math.abs(y - carDragY0);

    carTarget = Math.max(0, Math.min(CARDS.length - 1, Math.round(carPosition)));

    /* Treat as click if barely moved */
    if (dx < 8 && dy < 8) {
        const cardEl = target?.closest?.('.c-card');
        if (cardEl) {
            const idx    = parseInt(cardEl.dataset.index);
            const center = Math.round(carPosition);
            if (idx === center) {
                openOverlay(idx);
                return;
            }
            carTarget = idx;
        }
    }

    carSpring();
}

carouselStage.addEventListener('mousedown', (e) => {
    e.preventDefault();
    onCarDragStart(e.clientX, e.clientY);
});
document.addEventListener('mousemove', (e) => {
    if (carDragging) onCarDragMove(e.clientX);
});
document.addEventListener('mouseup', (e) => {
    if (carDragging) onCarDragEnd(e.clientX, e.clientY, e.target);
});

carouselStage.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    onCarDragStart(t.clientX, t.clientY);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
    if (carDragging) onCarDragMove(e.touches[0].clientX);
}, { passive: true });
document.addEventListener('touchend', (e) => {
    if (!carDragging) return;
    const t = e.changedTouches[0];
    onCarDragEnd(t.clientX, t.clientY, document.elementFromPoint(t.clientX, t.clientY));
});

/* ─────────────────────────────────────────────
   OVERLAY
───────────────────────────────────────────── */
const overlay        = document.getElementById('overlay');
const overlayBackdrop= document.getElementById('overlay-backdrop');
const overlayCName   = document.getElementById('overlay-card-name');
const overlayTLine   = document.getElementById('overlay-type-line');
const overlayS1      = document.getElementById('overlay-section1');
const overlayS2      = document.getElementById('overlay-section2');
const overlayFrontImg= document.getElementById('overlay-front-img');
const overlayCardInn = document.getElementById('overlay-card-inner');
const overlayCardSide= document.getElementById('overlay-card-side');
const overlayShine   = document.getElementById('overlay-card-shine');
const flipHint       = document.getElementById('overlay-flip-hint');

let isFlipped = false;

function openOverlay(idx) {
    const d = CARDS[idx];
    isFlipped = false;
    overlayCardInn.classList.remove('flipped');
    overlayCardInn.style.transform  = '';
    overlayCardInn.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
    overlayFrontImg.src     = d.img;
    overlayCName.textContent= d.name;
    overlayTLine.textContent= d.typeLine;
    overlayS1.textContent   = d.about;
    overlayS2.textContent   = d.why;
    flipHint.textContent    = 'click to flip';
    overlay.classList.add('active');
    overlay.style.display   = 'flex';
}

function closeOverlay() {
    overlay.classList.remove('active');
    overlay.style.display   = 'none';
    isFlipped               = false;
    overlayCardInn.classList.remove('flipped');
    overlayCardInn.style.transform  = '';
    overlayShine.style.background   = '';
}

/* Backdrop click */
overlayBackdrop.addEventListener('click', closeOverlay);

/* Escape */
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay(); });

/* Card flip */
overlayCardSide.addEventListener('click', (e) => {
    e.stopPropagation();
    isFlipped = !isFlipped;
    overlayCardInn.classList.toggle('flipped', isFlipped);
    overlayCardInn.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
    overlayCardInn.style.transform  = isFlipped ? 'rotateY(180deg)' : '';
    flipHint.textContent = isFlipped ? 'click to flip back' : 'click to flip';
});

/* Parallax tilt + foil shimmer */
overlayCardSide.addEventListener('mousemove', (e) => {
    const rect = overlayCardSide.getBoundingClientRect();
    const dx   = (e.clientX - rect.left - rect.width  / 2) / (rect.width  / 2);
    const dy   = (e.clientY - rect.top  - rect.height / 2) / (rect.height / 2);
    const clamp= (v,a,b) => Math.min(Math.max(v,a),b);
    const rx   = clamp(-dy * 12, -12, 12);
    const ry   = clamp( dx * 12, -12, 12);

    overlayCardInn.style.transition = 'transform 0.08s ease-out';
    overlayCardInn.style.transform  = isFlipped
        ? `rotateY(${180 + ry}deg) rotateX(${rx}deg)`
        : `rotateY(${ry}deg) rotateX(${rx}deg)`;

    const mx   = ((e.clientX - rect.left) / rect.width  * 100).toFixed(1);
    const my   = ((e.clientY - rect.top)  / rect.height * 100).toFixed(1);
    const hue  = (parseFloat(mx) / 100 * 300 + parseFloat(my) / 100 * 150) % 360;
    overlayShine.style.background =
        `radial-gradient(circle at ${mx}% ${my}%,` +
        `rgba(255,255,255,0.24) 0%,` +
        `hsla(${hue},100%,72%,0.14) 22%,` +
        `hsla(${(hue+70)%360},100%,68%,0.08) 44%,` +
        `transparent 66%)`;
});

overlayCardSide.addEventListener('mouseleave', () => {
    overlayCardInn.style.transition = 'transform 0.5s ease';
    overlayCardInn.style.transform  = isFlipped ? 'rotateY(180deg)' : '';
    overlayShine.style.background   = '';
});

/* Stop info-side clicks from closing */
document.getElementById('overlay-info-side').addEventListener('click', (e) => e.stopPropagation());
</script>
