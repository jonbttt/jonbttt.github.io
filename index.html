<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonathan — Open the Pack</title>
    <style>
        @font-face { font-family: 'MPlantin';     src: url("fonts/mplantin.ttf")           format("truetype"); }
        @font-face { font-family: 'Beleren Bold'; src: url("fonts/beleren-bold_P1.01.ttf") format("truetype"); }

        :root {
            --gold:       #c9a84c;
            --gold-light: #f0d080;
            --darker:     #1a0f06;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'MPlantin', Georgia, serif;
            background: var(--darker);
            color: #e8d8b0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('img/table.jpg') center center / cover no-repeat;
            filter: brightness(0.55) saturate(0.7) blur(1.5px);
            pointer-events: none;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: multiply;
        }

        /* ═══ PLAYMAT ═══ */
        #landing {
            position: relative;
            z-index: 2;
            width: min(90vw, calc(90vh * 16 / 10));
            height: min(90vh, calc(90vw * 10 / 16));
            flex-shrink: 0;
        }

        #playmat {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            border-radius: 6%;
            box-shadow: 0 35px 80px rgba(0,0,0,0.95), 0 0 0 1px rgba(201,168,76,0.15);
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        #landing::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 6%;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.45) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ═══ PACK SCENE ═══ */
        #pack-scene {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            perspective: 900px;
            animation: fadeUp 0.9s ease both;
            user-select: none;
        }

        #pack-wrapper {
            position: relative;
            width: clamp(140px, 15vw, 220px);
            aspect-ratio: 3 / 4.2;
            transform-style: preserve-3d;
            transition: transform 0.08s ease-out;
        }

        #pack-img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            position: relative;
            z-index: 1;
        }

        #pack-shine {
            position: absolute;
            inset: 0;
            border-radius: 8px;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
            transition: background 0.05s;
        }

        #pack-shine.idle { animation: idleShimmer 4s ease-in-out infinite; }

        @keyframes idleShimmer {
            0%   { background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.12) 0%, rgba(201,168,76,0.1) 25%, transparent 55%); }
            25%  { background: radial-gradient(circle at 70% 30%, rgba(255,255,255,0.15) 0%, rgba(120,200,255,0.1) 25%, transparent 55%); }
            50%  { background: radial-gradient(circle at 60% 70%, rgba(255,255,255,0.12) 0%, rgba(201,168,76,0.12) 25%, transparent 55%); }
            75%  { background: radial-gradient(circle at 25% 65%, rgba(255,255,255,0.14) 0%, rgba(200,150,255,0.08) 25%, transparent 55%); }
            100% { background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.12) 0%, rgba(201,168,76,0.1) 25%, transparent 55%); }
        }

        /* cut zone */
        #cut-zone {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 20%;
            z-index: 10;
            cursor: crosshair;
            border-radius: 8px 8px 0 0;
        }

        #cut-indicator {
            position: absolute;
            inset: 0;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
            pointer-events: none;
        }

        #cut-indicator::before {
            content: '';
            position: absolute;
            top: 0; left: -60%; width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(201,168,76,0) 20%, rgba(201,168,76,0.6) 50%, rgba(255,240,150,0.9) 55%, rgba(201,168,76,0.6) 60%, rgba(201,168,76,0) 80%, transparent 100%);
            animation: sweepLine 2s ease-in-out infinite;
            filter: blur(1px);
        }

        #cut-indicator::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 1.5px;
            background: repeating-linear-gradient(90deg, transparent 0px, transparent 4px, rgba(201,168,76,0.7) 4px, rgba(201,168,76,0.7) 8px);
            animation: dashPulse 1.5s ease-in-out infinite;
        }

        @keyframes sweepLine { 0%{left:-60%} 100%{left:120%} }
        @keyframes dashPulse { 0%,100%{opacity:.5} 50%{opacity:1} }

        #cut-glow {
            position: absolute;
            top: 0; left: 0;
            width: 40px; height: 100%;
            pointer-events: none;
            z-index: 11;
            display: none;
            transform: translateX(var(--gx, 0px));
            background: radial-gradient(ellipse at center, rgba(255,230,100,0.95) 0%, rgba(201,168,76,0.5) 40%, transparent 70%);
            filter: blur(3px);
            border-radius: 50%;
        }

        #cut-progress-wrap {
            position: absolute;
            bottom: -6px; left: 10%; right: 10%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            pointer-events: none;
        }

        #cut-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(201,168,76,0.4), rgba(255,240,150,1), rgba(201,168,76,0.4));
            border-radius: 2px;
            transition: width 0.05s linear;
            box-shadow: 0 0 8px rgba(201,168,76,0.8);
        }

        @keyframes shake {
            0%  {transform:rotate(0deg) scale(1)}
            20% {transform:rotate(-3deg) scale(1.03)}
            40% {transform:rotate(3deg)  scale(1.06)}
            60% {transform:rotate(-2deg) scale(1.04)}
            80% {transform:rotate(1deg)  scale(1.02)}
            100%{transform:rotate(0deg) scale(1)}
        }

        #tear-top, #tear-bottom { position: fixed; pointer-events: none; z-index: 50; overflow: hidden; }

        #golden-burst {
            position: fixed; pointer-events: none; z-index: 60;
            border-radius: 50%; width: 0; height: 0;
            background: radial-gradient(circle, rgba(255,230,80,0.9) 0%, rgba(201,168,76,0.6) 30%, rgba(201,168,76,0) 70%);
            opacity: 0;
        }

        #golden-burst.burst { animation: goldenBurst 0.6s ease-out forwards; }

        @keyframes goldenBurst {
            0%  { width:0; height:0; opacity:0.9; }
            100%{ width:600px; height:600px; opacity:0; }
        }

        /* ═══ CARDS ON MAT ═══ */
        .card {
            position: absolute;
            z-index: 3;
            width: 14%;
            aspect-ratio: 5 / 7;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            /* resting rotation comes from inline --r, applied by JS */
            transform-origin: center center;
            filter: drop-shadow(0 6px 18px rgba(0,0,0,0.8));
            /* transition handles BOTH the rotate and scale smoothly */
            transition: opacity 0.4s ease, transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.3s ease;
        }

        .card.landed {
            opacity: 1;
            pointer-events: auto;
        }

        /* hovered state — JS adds/removes this class */
        .card.hovered {
            transform: rotate(0deg) scale(1.08) translateY(-8px) !important;
            z-index: 10;
            filter: drop-shadow(0 16px 36px rgba(0,0,0,0.95));
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 4.5%;
        }

        /* ═══ CARD DETAIL OVERLAY ═══ */
        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        #overlay.active { display: flex; }

        #overlay-bg {
            position: absolute;
            inset: 0;
            backdrop-filter: blur(18px) brightness(0.35);
            -webkit-backdrop-filter: blur(18px) brightness(0.35);
            cursor: pointer;
        }

        #overlay-inner {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: stretch;
            gap: 0;
            width: min(900px, 92vw);
            height: min(580px, 85vh);
            animation: overlayIn 0.4s cubic-bezier(0.2, 0, 0, 1) both;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 40px 120px rgba(0,0,0,0.9), 0 0 0 1px rgba(201,168,76,0.2);
        }

        @keyframes overlayIn {
            from { opacity: 0; transform: scale(0.88) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        #overlay-card-side {
            width: 42%;
            flex-shrink: 0;
            background: #080604;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        #overlay-card-side::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, #1a0e04 0%, transparent 80%);
            pointer-events: none;
        }

        #flip-hint {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(201,168,76,0.5);
            white-space: nowrap;
            animation: pulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        #overlay-card-3d {
            width: 100%;
            max-width: 220px;
            aspect-ratio: 5 / 7;
            perspective: 800px;
            position: relative;
            z-index: 1;
        }

        #overlay-card-inner {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
            position: relative;
        }

        #overlay-card-inner.flipped { transform: rotateY(180deg); }

        #overlay-card-front, #overlay-card-back-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
        }

        #overlay-card-front img,
        #overlay-card-back-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 14px;
        }

        #overlay-card-back-face { transform: rotateY(180deg); }

        #overlay-card-shine {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
            transition: background 0.06s;
        }

        #overlay-info-side {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #overlay-info-side::-webkit-scrollbar { width: 4px; }
        #overlay-info-side::-webkit-scrollbar-track { background: #f0f0f0; }
        #overlay-info-side::-webkit-scrollbar-thumb { background: #c9a84c; border-radius: 2px; }

        #overlay-info-top {
            padding: 1.8rem 2rem 1.2rem;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        #overlay-card-label {
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 0.4rem;
            font-family: 'Beleren Bold', serif;
        }

        #overlay-card-name {
            font-family: 'Beleren Bold', serif;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            color: #1a0e04;
            letter-spacing: 0.04em;
            line-height: 1.1;
        }

        #overlay-card-type {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.3rem;
            font-style: italic;
        }

        #overlay-info-body {
            padding: 1.4rem 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .info-section-label {
            font-family: 'Beleren Bold', serif;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 0.4rem;
        }

        .info-section-text {
            font-size: 0.82rem;
            line-height: 1.7;
            color: #333;
        }

        .info-section-text strong { color: #1a0e04; }

        .info-divider {
            height: 1px;
            background: linear-gradient(90deg, var(--gold), transparent);
            opacity: 0.3;
        }

        .info-why {
            font-size: 0.78rem;
            line-height: 1.75;
            color: #555;
            font-style: italic;
            border-left: 2px solid var(--gold);
            padding-left: 0.9rem;
            opacity: 0.9;
        }

        #overlay-tags {
            padding: 1rem 2rem 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        .overlay-tag {
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #6b4f1a;
            border: 1px solid rgba(201,168,76,0.5);
            border-radius: 3px;
            padding: 0.2rem 0.5rem;
            background: rgba(201,168,76,0.08);
            font-family: 'Beleren Bold', serif;
        }

        #overlay-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 10;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
        }

        #overlay-close:hover { background: rgba(255,255,255,0.25); }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            animation: particleFly var(--dur,.8s) ease-out forwards;
        }

        @keyframes particleFly {
            0%  { transform:translate(0,0) scale(1) rotate(0deg); opacity:1; }
            100%{ transform:translate(var(--tx),var(--ty)) scale(0) rotate(var(--rot,180deg)); opacity:0; }
        }

        @keyframes fadeUp {
            from{opacity:0;transform:translate(-50%,calc(-50% + 20px))}
            to  {opacity:1;transform:translate(-50%,-50%)}
        }

        @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }

        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:var(--darker)}
        ::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.25);border-radius:3px}
    </style>
</head>
<body>

    <div id="golden-burst"></div>

    <!-- ═══ CARD DETAIL OVERLAY ═══ -->
    <div id="overlay">
        <div id="overlay-bg"></div>
        <div id="overlay-inner">
            <div id="overlay-card-side">
                <div id="overlay-card-3d">
                    <div id="overlay-card-inner">
                        <div id="overlay-card-front">
                            <img id="overlay-front-img" src="" alt="" />
                            <div id="overlay-card-shine"></div>
                        </div>
                        <div id="overlay-card-back-face">
                            <img src="img/cardback.png" alt="Card Back" />
                        </div>
                    </div>
                </div>
                <p id="flip-hint">click to flip</p>
            </div>

            <div id="overlay-info-side">
                <div id="overlay-info-top">
                    <div id="overlay-card-label">Card</div>
                    <div id="overlay-card-name"></div>
                    <div id="overlay-card-type"></div>
                </div>
                <div id="overlay-info-body"></div>
                <div id="overlay-tags"></div>
            </div>

            <button id="overlay-close">✕</button>
        </div>
    </div>

    <!-- ═══ LANDING ═══ -->
    <section id="landing">
        <img id="playmat" src="img/playmat.png" alt="Playmat" draggable="false" />

        <!-- ROW 1 -->
        <div class="card" style="left:27%;  top:9%;"  data-index="0" data-r="-13">
            <div class="card-front"><img src="img/card-1.png" alt="Jonathan BT" /></div>
        </div>
        <div class="card" style="left:44%; top:6%;"  data-index="1" data-r="8">
            <div class="card-front"><img src="img/card-2.png" alt="Field Experience" /></div>
        </div>
        <div class="card" style="left:60%; top:12%;"  data-index="2" data-r="-5">
            <div class="card-front"><img src="img/card-3.png" alt="Side Projects" /></div>
        </div>

        <!-- ROW 2 -->
        <div class="card" style="left:23%; top:42%;" data-index="3" data-r="15">
            <div class="card-front"><img src="img/card-4.png" alt="Jonathan, Iron" /></div>
        </div>
        <div class="card" style="left:46%; top:44%;" data-index="4" data-r="-17">
            <div class="card-front"><img src="img/card-5.png" alt="My Mox" /></div>
        </div>
        <div class="card" style="left:62%; top:41%;" data-index="5" data-r="11">
            <div class="card-front"><img src="img/card-6.png" alt="Wanderlust" /></div>
        </div>

        <!-- PACK -->
        <div id="pack-scene">
            <div id="pack-wrapper">
                <img id="pack-img" src="img/pack.png" alt="Booster Pack" draggable="false" />
                <div id="pack-shine" class="idle"></div>
                <div id="cut-zone">
                    <div id="cut-indicator"></div>
                    <div id="cut-glow"></div>
                    <div id="cut-progress-wrap"><div id="cut-progress-bar"></div></div>
                </div>
            </div>
        </div>
    </section>

    <div id="tear-top"></div>
    <div id="tear-bottom"></div>

    <script>
    // ═══ CARD DATA ═══
    const CARD_DATA = [
        {
            img:   'img/card-1.png',
            label: 'Legendary Creature — Human Artificer',

            sections: [
                { heading: 'Projects', text: '<strong>rk-veil</strong> — A Linux kernel module rootkit built from scratch. Syscall hooking, process hiding, and privilege escalation on kernel v6. Named for its stealth — a veil over the system.<br><br><strong>Home Lab SIEM</strong> — ELK Stack with OTX AlienVault threat intelligence feeds and Jira ticketing integration. A full detection engineering pipeline at home.<br><br><strong>MR Sandbox</strong> — Meta Quest 3 mixed reality chemistry education app. Unity MonoBehaviour architecture, hand tracking, wrist menu system.' },

                { heading: 'Lifting', text: 'Competitive powerlifter, ~72kg weight class. About 2.5 years of serious training. Currently in a cutting phase — tracking macros closely, optimising nutrition around session timing, managing sleep for recovery.<br><br>Main lifts: Squat, Bench, Deadlift. Current sticking point is the stretch reflex out of the hole on squat — working on it consistently. Accessory work includes hack squats and lat development based on recent EMG research.' },
                { heading: 'Why This Card', text: 'Red and Green are the MTG colours of physicality, instinct, and raw strength — the classic combination for warriors. Legendary Creature because this is another face card, another side of me that\'s just as defining as the tech work. The gym selfie felt honest. No staged platform shot — just showing up.', quote: true }
            ],
            tags: ['Powerlifting', '72kg', 'Cutting', 'Squat', 'Bench', 'Deadlift']
        },
        {
            img:   'img/card-5.png',
            label: 'Artifact — Passion',
            name:  'My Mox',
            type:  '{0} — Rare',
            sections: [
                { heading: 'MTG', text: 'Avid Magic: The Gathering player. Mainly Commander with friends, and MTG Arena on downtime. Commander is where the game shines — long games, creative decks, social politics.<br><br>Currently running 5 decks. Check them out at <strong>moxfield.com/users/jonbttt</strong><br><br>Deck 1 · Deck 2 · Deck 3 · Deck 4 · Deck 5 — fill in your commanders here.' },
                { heading: 'Why This Card', text: 'A Mox is one of the most powerful artifacts in MTG history — zero cost, immediate value, a collector\'s dream. Naming it "My Mox" is a bit of self-aware humour: this is my most prized personal card, representing a game I genuinely love. The {0} casting cost felt right — this part of me costs nothing to show up.', quote: true }
            ],
            tags: ['Commander', 'Arena', 'Moxfield', 'EDH']
        },
        {
            img:   'img/card-6.png',
            label: 'Enchantment — Wanderlust',
            name:  'Boundless Horizon',
            type:  '{G}{U} — Uncommon',
            sections: [
                { heading: 'Travel', text: 'Countries visited: TBD · TBD · TBD<br><br><strong>Favourite destination:</strong> TBD<br><strong>Most memorable moment:</strong> TBD<br><strong>Next on the list:</strong> TBD<br><br>Travel has been part of life from the start — growing up between Indonesia and visiting across Asia and beyond. Always looking for the next stamp.' },
                { heading: 'Why This Card', text: 'Green and Blue in MTG represent exploration, growth, and wisdom — the colours of someone who moves through the world with curiosity. Enchantment because travel isn\'t a one-time event, it\'s a persistent effect on who you are. Every place you visit changes you a little.', quote: true }
            ],
            tags: ['Travel', 'Exploration', 'Asia', 'TBD countries']
        }
    ];

    // ═══ SET INITIAL CARD ROTATIONS ═══
    // Store rotation as data attribute, apply via JS so we can transition cleanly
    const cards = Array.from(document.querySelectorAll('.card'));
    cards.forEach(card => {
        const r = parseFloat(card.dataset.r) || 0;
        card.style.transform = `rotate(${r}deg)`;
    });

    // ═══ HOVER — straighten on enter, restore on leave ═══
    cards.forEach(card => {
        const r = parseFloat(card.dataset.r) || 0;

        card.addEventListener('mouseenter', () => {
            if (!card.classList.contains('landed')) return;
            card.classList.add('hovered');
        });

        card.addEventListener('mouseleave', () => {
            card.classList.remove('hovered');
            // restore resting rotation after class removed
            card.style.transform = `rotate(${r}deg)`;
        });
    });

    // ═══ PACK / CUT LOGIC ═══
    const packWrapper  = document.getElementById('pack-wrapper');
    const packImg      = document.getElementById('pack-img');
    const packShine    = document.getElementById('pack-shine');
    const cutZone      = document.getElementById('cut-zone');
    const cutGlow      = document.getElementById('cut-glow');
    const cutBar       = document.getElementById('cut-progress-bar');
    const landing      = document.getElementById('landing');
    const tearTop      = document.getElementById('tear-top');
    const tearBot      = document.getElementById('tear-bottom');
    const goldenBurst  = document.getElementById('golden-burst');

    let opened = false, isDragging = false, dragStartX = null, dragCurrentX = null;
    const CUT_NEEDED = 0.7;

    let shineTimer = null;
    document.addEventListener('mousemove', (e) => {
        if (opened) return;
        const rect = packWrapper.getBoundingClientRect();
        const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
        const dx = (e.clientX - cx) / (rect.width / 2), dy = (e.clientY - cy) / (rect.height / 2);
        const cl = (v,a,b) => Math.min(Math.max(v,a),b);
        if (!isDragging) packWrapper.style.transform = `rotateY(${cl(dx*20,-20,20)}deg) rotateX(${cl(-dy*20,-20,20)}deg)`;

        const px = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
        const py = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
        packShine.classList.remove('idle');
        packShine.style.background = `radial-gradient(circle at ${px}% ${py}%, rgba(255,255,255,0.22) 0%, rgba(201,168,76,0.18) 20%, rgba(120,200,255,0.08) 40%, transparent 65%)`;

        clearTimeout(shineTimer);
        shineTimer = setTimeout(() => { packShine.classList.add('idle'); if (!isDragging) packWrapper.style.transform = ''; }, 1500);
    });

    document.addEventListener('mouseleave', () => { if (!opened) { packWrapper.style.transform = ''; packShine.classList.add('idle'); } });

    function startCut(x) { if (opened) return; isDragging = true; dragStartX = x; dragCurrentX = x; cutGlow.style.display = 'block'; packShine.classList.remove('idle'); }

    function moveCut(x) {
        if (!isDragging || opened) return;
        dragCurrentX = x;
        const rect = packWrapper.getBoundingClientRect();
        const progress = Math.min(Math.max((x - dragStartX) / rect.width, 0), 1);
        cutGlow.style.setProperty('--gx', (x - rect.left - 20) + 'px');
        cutBar.style.width = (progress * 100) + '%';
        packWrapper.style.transform = `rotateZ(${(Math.random()-0.5)*1.5}deg) rotateY(${(progress-0.5)*10}deg)`;
        if (progress >= CUT_NEEDED) completeCut();
    }

    function cancelCut() {
        if (!isDragging) return;
        isDragging = false; dragStartX = null; dragCurrentX = null;
        cutBar.style.width = '0%'; cutGlow.style.display = 'none';
        packWrapper.style.transform = ''; packShine.classList.add('idle');
    }

    function completeCut() {
        if (opened) return;
        opened = true; isDragging = false; cutGlow.style.display = 'none'; cutBar.style.width = '100%';
        const rect = packWrapper.getBoundingClientRect();
        goldenBurst.style.top  = (rect.top + rect.height * 0.05) + 'px';
        goldenBurst.style.left = (rect.left + rect.width / 2) + 'px';
        goldenBurst.style.transform = 'translate(-50%, -50%)';
        goldenBurst.classList.add('burst');
        setTimeout(tearOpen, 120);
    }

    cutZone.addEventListener('mousedown', (e) => { e.preventDefault(); startCut(e.clientX); });
    document.addEventListener('mousemove', (e) => { if (isDragging) moveCut(e.clientX); });
    document.addEventListener('mouseup', () => { if (isDragging) cancelCut(); });
    cutZone.addEventListener('touchstart', (e) => { e.preventDefault(); startCut(e.touches[0].clientX); }, { passive: false });
    document.addEventListener('touchmove', (e) => { if (isDragging) moveCut(e.touches[0].clientX); });
    document.addEventListener('touchend', () => { if (isDragging) cancelCut(); });

    function tearOpen() {
        const src = packImg.src;
        const rect = packWrapper.getBoundingClientRect();
        const topH = rect.height * 0.05, botH = rect.height - topH;

        tearTop.style.cssText = `position:fixed;pointer-events:none;z-index:50;overflow:hidden;width:${rect.width}px;height:${topH}px;left:${rect.left}px;top:${rect.top}px;border-radius:8px 8px 0 0;transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .3s ease .32s;`;
        tearTop.innerHTML = `<img src="${src}" style="width:100%;height:${rect.height}px;object-fit:fill;border-radius:8px;">`;
        tearBot.style.cssText = `position:fixed;pointer-events:none;z-index:50;overflow:hidden;width:${rect.width}px;height:${botH}px;left:${rect.left}px;top:${rect.top+topH}px;border-radius:0 0 8px 8px;transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .3s ease .32s;`;
        tearBot.innerHTML = `<img src="${src}" style="width:100%;height:${rect.height}px;object-fit:fill;border-radius:8px;margin-top:-${topH}px;">`;

        packImg.style.opacity = '0';
        packShine.style.opacity = '0';

        // kill cut UI immediately
        document.getElementById('cut-zone').style.display = 'none';
        document.getElementById('cut-indicator').style.display = 'none';
        document.getElementById('cut-progress-wrap').style.display = 'none';
        cutGlow.style.display = 'none';

        spawnGoldenParticles(rect.left + rect.width / 2, rect.top + topH);

        requestAnimationFrame(() => requestAnimationFrame(() => {
            tearTop.style.transform = `translateY(-${topH + 120}px)`; tearTop.style.opacity = '0';
            tearBot.style.transform = `translateY(${botH + 120}px)`;  tearBot.style.opacity = '0';
        }));

        setTimeout(() => {
            document.getElementById('pack-scene').style.display = 'none';
            tearTop.style.display = 'none';
            tearBot.style.display = 'none';
            goldenBurst.classList.remove('burst');

            cards.forEach((card, i) => {
                setTimeout(() => {
                    const r = parseFloat(card.dataset.r) || 0;
                    card.style.transform = `rotate(${r}deg)`;
                    card.classList.add('landed');
                }, i * 150);
            });
        }, 750);
    }

    function spawnGoldenParticles(x, y) {
        const colors = ['#f0d080','#c9a84c','#fff8dc','#ffd700'];
        for (let i = 0; i < 24; i++) {
            const p = document.createElement('div'); p.className = 'particle';
            const angle = (i/24)*Math.PI*2, dist = 60+Math.random()*160, size = 2+Math.random()*4, dur = 0.5+Math.random()*0.6;
            p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size*3}px;border-radius:2px;background:${colors[Math.floor(Math.random()*colors.length)]};--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;--dur:${dur}s;--rot:${Math.random()*360}deg;box-shadow:0 0 6px 2px rgba(255,220,60,0.7);`;
            document.body.appendChild(p); setTimeout(() => p.remove(), dur*1000+150);
        }
        for (let i = 0; i < 8; i++) {
            const p = document.createElement('div'); p.className = 'particle';
            const angle = Math.random()*Math.PI*2, dist = 30+Math.random()*80, size = 8+Math.random()*16, dur = 0.4+Math.random()*0.4;
            p.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-radius:50%;background:radial-gradient(circle, rgba(255,240,100,0.9) 0%, rgba(201,168,76,0.4) 60%, transparent 100%);--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;--dur:${dur}s;box-shadow:0 0 12px 4px rgba(255,200,40,0.5);`;
            document.body.appendChild(p); setTimeout(() => p.remove(), dur*1000+150);
        }
    }

    // ═══ OVERLAY ═══
    const overlay         = document.getElementById('overlay');
    const overlayBg       = document.getElementById('overlay-bg');
    const overlayClose    = document.getElementById('overlay-close');
    const overlayFrontImg = document.getElementById('overlay-front-img');
    const overlayCardInner= document.getElementById('overlay-card-inner');
    const overlayCardSide = document.getElementById('overlay-card-side');
    const overlayCardShine= document.getElementById('overlay-card-shine');
    const overlayCardName = document.getElementById('overlay-card-name');
    const overlayCardType = document.getElementById('overlay-card-type');
    const overlayCardLabel= document.getElementById('overlay-card-label');
    const overlayInfoBody = document.getElementById('overlay-info-body');
    const overlayTags     = document.getElementById('overlay-tags');
    const flipHint        = document.getElementById('flip-hint');

    let cardFlipped = false;

    function openOverlay(index) {
        const data = CARD_DATA[index];
        cardFlipped = false;
        overlayCardInner.classList.remove('flipped');
        overlayFrontImg.src = data.img;
        overlayCardLabel.textContent = data.label;
        overlayCardName.textContent  = data.name;
        overlayCardType.textContent  = data.type;
        flipHint.textContent = 'click to flip';

        overlayInfoBody.innerHTML = data.sections.map((s, i) => `
            ${i > 0 ? '<div class="info-divider"></div>' : ''}
            <div>
                <div class="info-section-label">${s.heading}</div>
                ${s.quote
                    ? `<p class="info-why">${s.text}</p>`
                    : `<p class="info-section-text">${s.text}</p>`
                }
            </div>
        `).join('');

        overlayTags.innerHTML = data.tags.map(t => `<span class="overlay-tag">${t}</span>`).join('');
        overlay.classList.add('active');
    }

    function closeOverlay() {
        overlay.classList.remove('active');
        cardFlipped = false;
        overlayCardInner.classList.remove('flipped');
    }

    cards.forEach((card) => {
        card.addEventListener('click', () => {
            if (!card.classList.contains('landed')) return;
            openOverlay(parseInt(card.dataset.index));
        });
    });

    overlayBg.addEventListener('click', closeOverlay);
    overlayClose.addEventListener('click', closeOverlay);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeOverlay(); });

    overlayCardSide.addEventListener('click', () => {
        cardFlipped = !cardFlipped;
        overlayCardInner.classList.toggle('flipped', cardFlipped);
        flipHint.textContent = cardFlipped ? 'click to flip back' : 'click to flip';
    });

    overlayCardSide.addEventListener('mousemove', (e) => {
        const rect = overlayCardSide.getBoundingClientRect();
        const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
        const dx = (e.clientX - cx) / (rect.width / 2), dy = (e.clientY - cy) / (rect.height / 2);
        const cl = (v,a,b) => Math.min(Math.max(v,a),b);
        overlayCardInner.style.transform = cardFlipped
            ? `rotateY(${180 + cl(dx*12,-12,12)}deg) rotateX(${cl(-dy*12,-12,12)}deg)`
            : `rotateY(${cl(dx*12,-12,12)}deg) rotateX(${cl(-dy*12,-12,12)}deg)`;
        overlayCardInner.style.transition = 'transform 0.08s ease-out';

        const px = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
        const py = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
        overlayCardShine.style.background = `radial-gradient(circle at ${px}% ${py}%, rgba(255,255,255,0.2) 0%, rgba(201,168,76,0.15) 25%, rgba(120,200,255,0.07) 50%, transparent 70%)`;
    });

    overlayCardSide.addEventListener('mouseleave', () => {
        overlayCardInner.style.transition = 'transform 0.5s ease';
        overlayCardInner.style.transform  = cardFlipped ? 'rotateY(180deg)' : '';
        overlayCardShine.style.background = 'none';
    });
    </script>
</body>
</html>
